<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NPC</title>
  <link rel="stylesheet" href="../../styles.css?v=theme-20260422"/>
  <script src="../../theme.js?v=theme-20260422"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title" id="title">NPC</div>
      <div class="subtitle"><a href="./npcs.html">← Zurück zu den NSC</a> • <a href="./bestiary.html">Bestiarium</a> • <a href="../../index.html">Startseite</a></div>
    </div>
  </header>

  <main class="main">
    <div class="content" style="max-width:900px;">
      <div id="view"></div>
    </div>
  </main>

  <script type="module">
    import {
      escapeHtml,
      loadIndex,
      loadMany,
      fmtSigned,
      mod,
      normalizeSpell,
      linkifyRefs,
      renderRichText as renderMarkdownText,
      buildLookupIndex,
      resolveEntityRef,
      entityLinkHtml,
      normalizeEntityRef
    } from "../../lib.js";

    const view = document.getElementById("view");
    const titleEl = document.getElementById("title");
    const id = new URLSearchParams(location.search).get("id");

    if (!id) {
      view.innerHTML = "<p>Fehlende NSC-ID.</p>";
      throw new Error("Fehlende NSC-ID");
    }

    const cacheMode = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "no-cache" : "force-cache";

    async function fetchJson(url){
      const r = await fetch(url, { cache: cacheMode });
      if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
      return r.json();
    }

    function slugifyLocal(value){
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFKD")
        .replace(/\u00df/g, "ss")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/['"`´’]/g, "")
        .replace(/&/g, " und ")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function normalizeNpcData(raw){
      if (!raw || typeof raw !== "object") return raw;

      const abilities = {};
      for (const key of ["str", "dex", "con", "int", "wis", "cha"]) {
        const value = raw.abilities?.[key];
        const score = typeof value === "object" ? Number(value?.score) : Number(value);
        if (Number.isFinite(score)) abilities[key] = score;
      }

      const languages = raw.languages && typeof raw.languages === "object" && !Array.isArray(raw.languages)
        ? [...(raw.languages.speaks || []), ...(raw.languages.understands || []).map(x => `versteht ${x}`)]
        : (Array.isArray(raw.languages) ? raw.languages : (raw.languages ? [String(raw.languages)] : []));

      const savingThrows = raw.saving_throws && typeof raw.saving_throws === "object" && !Array.isArray(raw.saving_throws)
        ? raw.saving_throws
        : Object.fromEntries(
            ["str", "dex", "con", "int", "wis", "cha"]
              .map(key => {
                const save = raw.abilities?.[key] && typeof raw.abilities[key] === "object"
                  ? Number(raw.abilities[key].save)
                  : NaN;
                return Number.isFinite(save) ? [key.toUpperCase(), save] : null;
              })
              .filter(Boolean)
          );

      return {
        ...raw,
        id: raw.id || slugifyLocal(raw.name),
        name: raw.name || "NSC",
        race: raw.subtype || raw.creature_type || raw.race || "",
        role: raw.role || "",
        faction: raw.faction || "",
        type: raw.creature_type || raw.type || "",
        alignment: raw.alignment || "",
        ac: raw.armor_class?.value ?? raw.ac ?? null,
        ac_note: raw.armor_class?.display ?? raw.armor_class?.note ?? raw.ac_note ?? "",
        hp: raw.hit_points?.average ?? raw.hp?.average ?? raw.hp ?? null,
        hp_formula: raw.hit_points?.formula ?? raw.hp?.formula ?? "",
        speed: raw.speeds ?? raw.speed ?? {},
        abilities,
        saving_throws: savingThrows,
        skills: raw.skills || {},
        senses: raw.senses || {},
        languages,
        challenge: {
          cr: String(raw.challenge_rating ?? raw.challenge?.cr ?? raw.challenge ?? ""),
          proficiency_bonus: raw.proficiency_bonus ?? raw.challenge?.proficiency_bonus ?? null
        },
        xp: raw.xp ?? "",
        notes: raw.notes || "",
        background: raw.background || "",
        personality: raw.personality || "",
        inventory: Array.isArray(raw.inventory) ? raw.inventory : [],
        traits: Array.isArray(raw.traits) ? raw.traits.map(t => ({ name: t.name, text: t.text ?? t.value ?? "" })) : [],
        actions: Array.isArray(raw.actions) ? raw.actions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        bonus_actions: Array.isArray(raw.bonus_actions) ? raw.bonus_actions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        reactions: Array.isArray(raw.reactions) ? raw.reactions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        legendary_description: raw.legendary_description || "",
        legendary_actions: Array.isArray(raw.legendary_actions) ? raw.legendary_actions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        spellcasting: Array.isArray(raw.spellcasting) ? raw.spellcasting : []
      };
    }

    async function loadNpc(idParam){
      const rawId = String(idParam || "").trim();
      const candidates = Array.from(new Set([
        rawId,
        slugifyLocal(rawId),
        rawId.toLowerCase()
      ].filter(Boolean)));

      for (const candidate of candidates) {
        try {
          const raw = await fetchJson(`../../data/monsters/npc/${encodeURIComponent(candidate)}.json`);
          return normalizeNpcData(raw);
        } catch {}
      }

      const files = await loadIndex("../../data/monsters/npc/index.json").catch(() => []);
      const npcs = (await loadMany("../../data/monsters/npc", files).catch(() => [])).map(normalizeNpcData);
      const lowered = rawId.toLowerCase();
      const slug = slugifyLocal(rawId);

      return (
        npcs.find(n => String(n.id || "").toLowerCase() === lowered) ||
        npcs.find(n => String(n.name || "").toLowerCase() === lowered) ||
        npcs.find(n => slugifyLocal(n.id || n.name || "") === slug) ||
        null
      );
    }

    async function loadSpellLookup(){
      const files = await loadIndex("../../data/spells/index.json").catch(() => []);
      const spells = await loadMany("../../data/spells", files).catch(() => []);
      return buildLookupIndex(spells.map(normalizeSpell));
    }

    function formatList(value) {
      if (!value) return "";
      if (Array.isArray(value)) {
        return value.map(entry => typeof entry === "object" ? `${entry.name || ""}${entry.note || ""}`.trim() : String(entry)).join(", ");
      }
      if (typeof value === "object") {
        return Object.entries(value).map(([key, entry]) => `${key} ${entry}`).join(", ");
      }
      return String(value);
    }

    function formatBonuses(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return formatList(value);
      return Object.entries(value)
        .map(([key, entry]) => {
          const numeric = typeof entry === "number" ? entry : Number(entry);
          const label = String(key).toUpperCase();
          return Number.isFinite(numeric) ? `${label} ${fmtSigned(numeric)}` : `${label} ${entry}`;
        })
        .join(", ");
    }

    function renderRichText(value, { empty = "—" } = {}) {
      const text = String(value ?? "").trim();
      return text ? renderMarkdownText(text, { lookups: { spell: spellLookup }, inlineOnly: true }) : escapeHtml(empty);
    }

    function renderRichList(values) {
      const items = (Array.isArray(values) ? values : [])
        .map(value => String(value ?? "").trim())
        .filter(Boolean);
      if (!items.length) return "";
      return `<ul>${items.map(item => `<li>${renderMarkdownText(item, { lookups: { spell: spellLookup }, inlineOnly: true })}</li>`).join("")}</ul>`;
    }

    function formatSpeed(speed) {
      if (!speed) return "—";
      if (typeof speed === "string") return speed;
      const order = ["walk", "fly", "swim", "climb", "burrow"];
      const labels = {
        walk: "Laufen",
        fly: "Fliegen",
        swim: "Schwimmen",
        climb: "Klettern",
        burrow: "Graben"
      };
      const parts = [];
      for (const key of order) {
        const value = speed[key];
        if (value == null || value === "") continue;
        parts.push(typeof value === "number" ? `${labels[key]} ${value} ft.` : `${labels[key]} ${value}`);
      }
      return parts.length ? parts.join(", ") : "—";
    }

    const spellLookup = await loadSpellLookup();

    function linkedSpellRef(ref) {
      if (typeof ref === "string" && ref.includes("[[")) {
        return linkifyRefs(ref, { lookups: { spell: spellLookup } });
      }
      const resolved = resolveEntityRef(ref, spellLookup);
      return entityLinkHtml("spell", resolved || normalizeEntityRef(ref), { base: "../zauber/" });
    }

    function renderSpellRefs(refs) {
      return (Array.isArray(refs) ? refs : [])
        .map(ref => {
          if (ref == null || ref === "") return "";
          return linkedSpellRef(ref);
        })
        .filter(Boolean)
        .join(", ");
    }

    function renderSpellcastingSection(entries) {
      return (Array.isArray(entries) ? entries : []).map(entry => {
        const groups = Object.entries(entry?.spells || {})
          .map(([key, refs]) => {
            const label = key === "cantrips_at_will"
              ? "Zaubertricks (beliebig)"
              : key.startsWith("level_")
                ? `Level ${key.replace("level_", "")}`
                : key.replaceAll("_", " ");
            const usageValue = entry?.usage?.[key];
            const usageSuffix = usageValue != null && usageValue !== ""
              ? ` <span class="muted">(${escapeHtml(usageValue)})</span>`
              : "";
            const html = renderSpellRefs(refs);
            return html ? `<div class="mini"><b>${escapeHtml(label)}:${usageSuffix}</b> ${html}</div>` : "";
          })
          .filter(Boolean)
          .join("");

        return `
          <div class="mini" style="margin-bottom:10px;">
            ${entry?.name ? `<div><b>${linkifyRefs(entry.name, { lookups: { spell: spellLookup } })}</b></div>` : ""}
            ${entry?.text ? `<div style="margin:4px 0 6px 0;">${renderMarkdownText(entry.text, { lookups: { spell: spellLookup }, inlineOnly: true })}</div>` : ""}
            ${groups}
          </div>
        `;
      }).join("");
    }

    const n = await loadNpc(id);
    if (!n) {
      view.innerHTML = `<p>NSC nicht gefunden: <code>${escapeHtml(id)}</code></p>`;
      throw new Error("NSC nicht gefunden");
    }

    titleEl.textContent = n.name || "NSC";

    const subtitle = [n.race, n.role, n.faction].filter(Boolean).join(" • ");
    const ab = n.abilities || {};
    const showAbilities = ["str", "dex", "con", "int", "wis", "cha"].some(k => ab?.[k] != null);
    const savesLine = Object.entries(n.saving_throws || {})
      .filter(([key, value]) => {
        const normalizedKey = String(key).toLowerCase();
        const abilityScore = ab?.[normalizedKey];
        const saveValue = typeof value === "number" ? value : Number(value);
        if (!Number.isFinite(saveValue)) return true;
        if (abilityScore == null) return true;
        return saveValue !== mod(abilityScore);
      })
      .map(([key, value]) => {
        const numeric = typeof value === "number" ? value : Number(value);
        const label = String(key).toUpperCase();
        return Number.isFinite(numeric) ? `${label} ${fmtSigned(numeric)}` : `${label} ${value}`;
      })
      .join(", ");
    const skillsLine = formatList(n.skills);
    const sensesLine = formatList(n.senses);
    const languagesLine = Array.isArray(n.languages) ? n.languages.join(", ") : formatList(n.languages);

    view.innerHTML = `
      <h1>${escapeHtml(n.name)}</h1>
      ${subtitle ? `<p class="muted">${escapeHtml(subtitle)}</p>` : ""}

      <div class="mini-box">
        <div class="mini-box-title">Werte</div>
        <div class="mini-box-text">
          ${n.ac != null ? `<div><b>RK:</b> ${escapeHtml(n.ac)}${n.ac_note ? ` <span class="muted">(${renderMarkdownText(n.ac_note, { lookups: { spell: spellLookup }, inlineOnly: true })})</span>` : ""}</div>` : ""}
          ${n.hp != null ? `<div><b>TP:</b> ${escapeHtml(n.hp)}${n.hp_formula ? ` <span class="muted">(${renderMarkdownText(n.hp_formula, { lookups: { spell: spellLookup }, inlineOnly: true })})</span>` : ""}</div>` : ""}
          <div><b>Bewegung:</b> ${escapeHtml(formatSpeed(n.speed))}</div>
          ${(n.challenge?.cr || n.challenge?.proficiency_bonus != null || n.xp) ? `
            <div>
              ${n.challenge?.cr ? `<b>HG:</b> ${escapeHtml(n.challenge.cr)}` : ""}
              ${n.challenge?.proficiency_bonus != null ? `${n.challenge?.cr ? ` • ` : ""}<b>ÜB:</b> ${escapeHtml(fmtSigned(n.challenge.proficiency_bonus))}` : ""}
              ${n.xp ? `${(n.challenge?.cr || n.challenge?.proficiency_bonus != null) ? ` • ` : ""}<b>EP:</b> ${escapeHtml(n.xp)}` : ""}
            </div>
          ` : ""}
        </div>
      </div>

      ${showAbilities ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Attribute</div>
          <div class="mini-box-text">
            <div>
              <b>STR</b> ${ab.str ?? "—"} (${fmtSigned(mod(ab.str ?? 10))}) •
              <b>DEX</b> ${ab.dex ?? "—"} (${fmtSigned(mod(ab.dex ?? 10))}) •
              <b>CON</b> ${ab.con ?? "—"} (${fmtSigned(mod(ab.con ?? 10))}) •
              <b>INT</b> ${ab.int ?? "—"} (${fmtSigned(mod(ab.int ?? 10))}) •
              <b>WIS</b> ${ab.wis ?? "—"} (${fmtSigned(mod(ab.wis ?? 10))}) •
              <b>CHA</b> ${ab.cha ?? "—"} (${fmtSigned(mod(ab.cha ?? 10))})
            </div>
          </div>
        </div>
      ` : ""}

      ${(savesLine || skillsLine || sensesLine || languagesLine) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Fertigkeiten</div>
          <div class="mini-box-text">
            ${savesLine ? `<div class="mini"><b>Rettungswürfe:</b> ${escapeHtml(savesLine)}</div>` : ""}
            ${skillsLine ? `<div class="mini"><b>Fertigkeiten:</b> ${escapeHtml(skillsLine)}</div>` : ""}
            ${sensesLine ? `<div class="mini"><b>Sinne:</b> ${escapeHtml(sensesLine)}</div>` : ""}
            ${languagesLine ? `<div class="mini"><b>Sprachen:</b> ${escapeHtml(languagesLine)}</div>` : ""}
          </div>
        </div>
      ` : ""}

      ${(n.spellcasting && n.spellcasting.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Zauber</div>
          <div class="mini-box-text">${renderSpellcastingSection(n.spellcasting)}</div>
        </div>
      ` : ""}

      ${n.notes ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Notizen</div>
          <div class="mini-box-text">${renderMarkdownText(n.notes, { lookups: { spell: spellLookup } })}</div>
        </div>
      ` : ""}

      ${(n.traits && n.traits.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Eigenschaften</div>
          <div class="mini-box-text">
            ${n.traits.map(t => `<div class="mini"><b>${linkifyRefs(t.name, { lookups: { spell: spellLookup } })}.</b> ${renderMarkdownText(t.text, { lookups: { spell: spellLookup }, inlineOnly: true })}</div>`).join("")}
          </div>
        </div>
      ` : ""}

      ${(n.actions && n.actions.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Aktionen</div>
          <div class="mini-box-text">
            ${n.actions.map(a => `<div class="mini"><b>${linkifyRefs(a.name, { lookups: { spell: spellLookup } })}.</b> ${renderMarkdownText(a.text || "", { lookups: { spell: spellLookup }, inlineOnly: true })}</div>`).join("")}
          </div>
        </div>
      ` : ""}

      ${(n.bonus_actions && n.bonus_actions.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Bonusaktionen</div>
          <div class="mini-box-text">
            ${n.bonus_actions.map(a => `<div class="mini"><b>${linkifyRefs(a.name, { lookups: { spell: spellLookup } })}.</b> ${renderMarkdownText(a.text || "", { lookups: { spell: spellLookup }, inlineOnly: true })}</div>`).join("")}
          </div>
        </div>
      ` : ""}

      ${(n.reactions && n.reactions.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Reaktionen</div>
          <div class="mini-box-text">
            ${n.reactions.map(a => `<div class="mini"><b>${linkifyRefs(a.name, { lookups: { spell: spellLookup } })}.</b> ${renderMarkdownText(a.text || "", { lookups: { spell: spellLookup }, inlineOnly: true })}</div>`).join("")}
          </div>
        </div>
      ` : ""}

      ${(n.legendary_actions && n.legendary_actions.length) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Legendäre Aktionen</div>
          <div class="mini-box-text">
            ${n.legendary_description ? `<div class="mini">${renderMarkdownText(n.legendary_description, { lookups: { spell: spellLookup } })}</div>` : ""}
            ${n.legendary_actions.map(a => `<div class="mini"><b>${linkifyRefs(a.name, { lookups: { spell: spellLookup } })}.</b> ${renderMarkdownText(a.text || "", { lookups: { spell: spellLookup }, inlineOnly: true })}</div>`).join("")}
          </div>
        </div>
      ` : ""}

      ${(n.background || n.personality || (n.inventory && n.inventory.length)) ? `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Charakter</div>
          <div class="mini-box-text">
            ${n.background ? `<div class="mini"><b>Hintergrund:</b> ${renderRichText(n.background)}</div>` : ""}
            ${n.personality ? `<div class="mini"><b>Persönlichkeit:</b> ${renderRichText(n.personality)}</div>` : ""}
            ${(n.inventory && n.inventory.length) ? `<div class="mini"><b>Inventar:</b>${renderRichList(n.inventory)}</div>` : ""}
          </div>
        </div>
      ` : ""}
    `;
  </script>
</body>
</html>
