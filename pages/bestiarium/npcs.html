<html>

  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <script src="../../theme.js?v=theme-20260422"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">NSC-Verzeichnis</div>
      <div class="subtitle">Nichtspielercharaktere aus dem Bestiarium</div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Suchen..."/>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <div class="group">
          <div class="group-title">Startseite</div>
          <a href="../../index.html">Startseite</a>
          <a href="../../index.html#content/house-rules/index.md">Hausregeln</a>
          <a href="../../index.html#content/safety/index.md">Sicherheit</a>
          <a href="../../index.html#content/character-options/index.md">Charakteroptionen</a>
          <a href="../../index.html#content/recaps/index.md">Rückblicke</a>
        </div>

        <div class="group">
          <div class="group-title">Werkzeuge</div>
          <a href="../werkzeuge/tools.html">Zufallstabellen & Generatoren</a>
          <a href="../werkzeuge/dice.html">Würfel</a>
          <a href="../werkzeuge/units.html">Umrechner</a>
        </div>

        <div class="group">
          <div class="group-title">Sammlungen</div>
          <a href="./bestiary.html">Bestiarium</a>
          <a href="./npcs.html" class="active">NSC</a>
          <a href="../zauber/spells.html">Zauber</a>
          <a href="../items/items.html">Gegenstände</a>

          <a href="../spieler/pcs.html">Spieler</a>
          <a href="../icons.html">Symbole</a>

    <main class="main">
      <div class="content" style="max-width:1100px;">
        <div id="grid" class="card-grid"></div>
      </div>
    </main>
  </div>

  <script src="../../nav.js"></script>
  <script type="module">
    import { escapeHtml, loadIndex, loadMany, fmtSigned, mod, renderRichText, formatSpeedList, renderRollExpressionHtml } from "../../lib.js?v=2026-04-27-hitdice-links";

    const grid = document.getElementById("grid");
    const qEl = document.getElementById("q");

    function normalizeNpcData(raw){
      if (!raw || typeof raw !== "object") return raw;

      const abilities = {};
      for (const key of ["str", "dex", "con", "int", "wis", "cha"]) {
        const value = raw.abilities?.[key];
        const score = typeof value === "object" ? Number(value?.score) : Number(value);
        if (Number.isFinite(score)) abilities[key] = score;
      }

      const languages = raw.languages && typeof raw.languages === "object" && !Array.isArray(raw.languages)
        ? [...(raw.languages.speaks || []), ...(raw.languages.understands || []).map(x => `versteht ${x}`)]
        : (Array.isArray(raw.languages) ? raw.languages : (raw.languages ? [String(raw.languages)] : []));

      return {
        ...raw,
        id: raw.id || raw.name || "",
        name: raw.name || "NSC",
        race: raw.subtype || raw.creature_type || raw.race || "",
        role: raw.role || "",
        faction: raw.faction || "",
        type: raw.creature_type || raw.type || "",
        alignment: raw.alignment || "",
        ac: raw.armor_class?.value ?? raw.ac ?? null,
        ac_note: raw.armor_class?.display ?? raw.ac_note ?? "",
        hp: raw.hit_points?.average ?? raw.hp?.average ?? raw.hp ?? null,
        hp_formula: raw.hit_points?.formula ?? raw.hp?.formula ?? raw.hit_dice ?? "",
        speed: raw.speeds ?? raw.speed ?? {},
        abilities,
        saving_throws: raw.saving_throws || {},
        skills: raw.skills || {},
        senses: raw.senses || {},
        languages,
        challenge: {
          cr: String(raw.challenge_rating ?? raw.challenge?.cr ?? raw.challenge ?? ""),
          proficiency_bonus: raw.proficiency_bonus ?? raw.challenge?.proficiency_bonus ?? null
        },
        xp: raw.xp ?? "",
        notes: raw.notes || "",
        traits: Array.isArray(raw.traits) ? raw.traits.map(t => ({ name: t.name, text: t.text ?? t.value ?? "" })) : [],
        actions: Array.isArray(raw.actions) ? raw.actions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        bonus_actions: Array.isArray(raw.bonus_actions) ? raw.bonus_actions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
        reactions: Array.isArray(raw.reactions) ? raw.reactions.map(a => ({ name: a.name, text: a.text ?? a.value ?? a.type ?? "" })) : [],
      };
    }

    function formatList(value){
      if (!value) return "";
      if (Array.isArray(value)) return value.join(", ");
      if (typeof value === "object") {
        return Object.entries(value).map(([key, entry]) => `${key} ${entry}`).join(", ");
      }
      return String(value);
    }

    function formatSpeed(speed){
      if (!speed) return "—";
      return formatSpeedList(speed) || "—";
    }

    function renderHitDice(value){
      const text = String(value ?? "").trim();
      if (!text) return "";
      return text.includes("[[")
        ? renderRichText(text, { inlineOnly: true })
        : renderRollExpressionHtml(text);
    }

    function card(n){
      const ab = n.abilities || {};
      const subtitle = [n.race, n.role, n.faction].filter(Boolean).join(" • ");
      const details = [n.type, n.alignment].filter(Boolean).join(", ");
      return `
        <div class="mini-card">
          <div class="mini-head">
            <div class="mini-title"><a href="./npc.html?id=${encodeURIComponent(n.id || n.name || "")}">${escapeHtml(n.name)}</a></div>
            <div class="mini-sub">${escapeHtml(subtitle || details || "NSC")}</div>
            <div class="pillbar">
              ${n.ac != null ? `<span class="pill"><b>RK</b> ${escapeHtml(n.ac)}</span>` : ""}
              ${n.hp != null ? `<span class="pill"><b>TP</b> ${escapeHtml(n.hp)}${n.hp_formula ? ` <span class="muted">(${renderHitDice(n.hp_formula)})</span>` : ""}</span>` : ""}
              <span class="pill"><b>Bewegung</b> ${escapeHtml(formatSpeed(n.speed))}</span>
              ${n.challenge?.cr ? `<span class="pill"><b>HG</b> ${escapeHtml(n.challenge.cr)}</span>` : ""}
            </div>
          </div>
          <div class="mini-body">
            <div class="mini-box">
              <div class="mini-box-title">Attribute</div>
              <div class="mini-box-text">
                <span class="abi"><b>STR</b> ${ab.str ?? "—"} (${fmtSigned(mod(ab.str ?? 10))})</span>
                <span class="abi"><b>DEX</b> ${ab.dex ?? "—"} (${fmtSigned(mod(ab.dex ?? 10))})</span>
                <span class="abi"><b>CON</b> ${ab.con ?? "—"} (${fmtSigned(mod(ab.con ?? 10))})</span>
                <span class="abi"><b>INT</b> ${ab.int ?? "—"} (${fmtSigned(mod(ab.int ?? 10))})</span>
                <span class="abi"><b>WIS</b> ${ab.wis ?? "—"} (${fmtSigned(mod(ab.wis ?? 10))})</span>
                <span class="abi"><b>CHA</b> ${ab.cha ?? "—"} (${fmtSigned(mod(ab.cha ?? 10))})</span>
              </div>
            </div>

            ${(n.skills || n.languages?.length || n.senses) ? `
              <div class="mini-box">
                <div class="mini-box-title">Fertigkeiten</div>
                <div class="mini-box-text">
                  ${n.skills ? `<div class="mini"><b>Fertigkeiten:</b> ${escapeHtml(formatList(n.skills))}</div>` : ""}
                  ${n.senses ? `<div class="mini"><b>Sinne:</b> ${escapeHtml(formatList(n.senses))}</div>` : ""}
                  ${n.languages?.length ? `<div class="mini"><b>Sprachen:</b> ${escapeHtml(n.languages.join(", "))}</div>` : ""}
                </div>
              </div>` : ""}

            ${(n.traits?.length) ? `<div class="mini-box"><div class="mini-box-title">Eigenschaften</div><div class="mini-box-text">${n.traits.slice(0, 2).map(t => `<div class="mini"><b>${renderRichText(t.name, { inlineOnly: true })}:</b> ${renderRichText(t.text, { inlineOnly: true })}</div>`).join("")}</div></div>` : ""}
            ${(n.actions?.length) ? `<div class="mini-box"><div class="mini-box-title">Aktionen</div><div class="mini-box-text">${n.actions.slice(0, 2).map(a => `<div class="mini"><b>${renderRichText(a.name, { inlineOnly: true })}:</b> ${renderRichText(a.text, { inlineOnly: true })}</div>`).join("")}</div></div>` : ""}

            <div class="mini-footer muted">${details ? escapeHtml(details) : ""}</div>
          </div>
        </div>
      `;
    }

    function matches(n, q){
      const hay = [
        n.name,
        n.race,
        n.role,
        n.faction,
        n.type,
        n.alignment,
        formatList(n.skills),
        formatList(n.senses),
        ...(n.languages || []),
        ...(n.traits || []).flatMap(t => [t.name, t.text]),
        ...(n.actions || []).flatMap(a => [a.name, a.text]),
        ...(n.bonus_actions || []).flatMap(a => [a.name, a.text]),
        ...(n.reactions || []).flatMap(a => [a.name, a.text]),
        n.notes
      ].join(" ").toLowerCase();
      return !q || hay.includes(q);
    }

    const files = await loadIndex("../../data/monsters/npc/index.json");
    const npcs = (await loadMany("../../data/monsters/npc", files)).map(normalizeNpcData);

    function render(){
      const q = (qEl.value || "").trim().toLowerCase();
      const filtered = npcs.filter(n => matches(n, q));
      grid.innerHTML = filtered.map(card).join("") || `<p>Keine Treffer.</p>`;
    }

    qEl.addEventListener("input", render);
    render();
  </script>
</body>
</html>
