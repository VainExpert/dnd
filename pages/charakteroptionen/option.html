<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Charakteroption</title>
  <link rel="stylesheet" href="../../styles.css?v=theme-20260422"/>
  <script src="../../theme.js?v=theme-20260422"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title" id="title">Charakteroption</div>
    </div>
  </header>

  <main class="main">
    <div class="content" style="max-width:900px;">
      <div id="view"></div>
    </div>
  </main>

  <script src="../../nav.js"></script>
  <script type="module">
    import { buildLookupIndex, escapeHtml, loadIndex, loadMany, renderRichText, slugify } from "../../lib.js?v=inline-refs-20260430";

    const COLLECTIONS = {
      class: { label: "Klasse", basePath: "../../data/classes", indexPath: "../../data/classes/index.json" },
      subclass: { label: "Unterklasse", basePath: "../../data/classes/subclasses", indexPath: "../../data/classes/subclasses/index.json" },
      background: { label: "Hintergrund", basePath: "../../data/backgrounds", indexPath: "../../data/backgrounds/index.json" },
      feat: { label: "Talent", basePath: "../../data/feats", indexPath: "../../data/feats/index.json" },
      race: { label: "Volk", basePath: "../../data/races", indexPath: "../../data/races/index.json" }
    };

    const LOOKUP_COLLECTIONS = {
      ...COLLECTIONS,
      spell: { label: "Zauber", basePath: "../../data/spells", indexPath: "../../data/spells/index.json" },
      item: { label: "Gegenstand", basePath: "../../data/items", indexPath: "../../data/items/index.json" }
    };

    const view = document.getElementById("view");
    const titleEl = document.getElementById("title");
    const optionLookups = {};

    function isMeaningful(value){
      if (value == null) return false;
      if (typeof value === "string") return value.trim() !== "";
      if (typeof value === "number") return Number.isFinite(value);
      if (typeof value === "boolean") return true;
      if (Array.isArray(value)) return value.some(isMeaningful);
      if (typeof value === "object") return Object.values(value).some(isMeaningful);
      return true;
    }

    function renderList(value){
      if (Array.isArray(value)) return value.filter(isMeaningful).map(entry => renderList(entry)).join(", ");
      if (value && typeof value === "object") {
        return Object.entries(value)
          .filter(([, entry]) => isMeaningful(entry))
          .map(([key, entry]) => `${escapeHtml(String(key).replaceAll("_", " "))}: ${renderList(entry)}`)
          .join(", ");
      }
      if (typeof value === "boolean") return escapeHtml(value ? "Ja" : "Nein");
      return richText(String(value ?? ""), { inlineOnly: true });
    }

    function subclassLinkList(option){
      return (Array.isArray(option?.subclasses) ? option.subclasses : [])
        .map(subclass => {
          const id = String(subclass?.id || subclass?.file || subclass?.name || "").replace(/^subclasses\//, "").replace(/\.json$/i, "");
          const name = subclass?.name || id;
          if (!id || !name) return "";
          return `[[subclass:${id}|${name}]]`;
        })
        .filter(Boolean)
        .join(", ");
    }

    function entryText(entry, option){
      const text = String(entry?.text ?? "");
      if (option?.collectionLabel !== "Klasse" || !Array.isArray(option.subclasses) || !text) return text;
      const subclasses = subclassLinkList(option);
      if (!subclasses) return text;

      return text.replace(/^Name:\s*.+$/i, `Name: ${subclasses}`);
    }

    function richText(text, options = {}){
      return renderRichText(text, { lookups: optionLookups, ...options });
    }

    function renderEntry(entry, option){
      if (!entry || typeof entry !== "object") return richText(String(entry ?? ""), { inlineOnly: true });

      if (entry.type === "heading") {
        const level = Math.min(Math.max(Number(entry.level) || 2, 2), 5);
        return `<h${level}>${richText(entryText(entry, option), { inlineOnly: true })}</h${level}>`;
      }

      if (entry.type === "list" && Array.isArray(entry.items)) {
        const tag = entry.ordered ? "ol" : "ul";
        return `<${tag}>${entry.items.map(item => `<li>${richText(String(item ?? ""), { inlineOnly: true })}</li>`).join("")}</${tag}>`;
      }

      if (entry.type === "table" && Array.isArray(entry.rows)) {
        return `<div class="table-scroll"><table class="roll-table"><tbody>${entry.rows.map((row, rowIndex) => {
          const cells = Array.isArray(row) ? row : [row];
          const tag = rowIndex === 0 ? "th" : "td";
          return `<tr>${cells.map(cell => `<${tag}>${richText(String(cell ?? ""), { inlineOnly: true })}</${tag}>`).join("")}</tr>`;
        }).join("")}</tbody></table></div>`;
      }

      if (entry.text) return `<p>${richText(entryText(entry, option))}</p>`;
      return `<p>${renderList(entry)}</p>`;
    }

    function renderDescription(option, fallback){
      if (option.html || option.description_html) return option.html || option.description_html;
      if (Array.isArray(option.entries) && option.entries.some(isMeaningful)) {
        return option.entries.map(entry => renderEntry(entry, option)).join("");
      }
      return richText(String(fallback || ""));
    }

    function optionName(entry, fallbackId){
      return entry.name || entry.title || entry.titel || entry.label || fallbackId;
    }

    function normalizeOption(entry, collection, sourceFile){
      const fallbackId = slugify(optionName(entry, ""));
      const id = String(entry.id || entry.slug || fallbackId || "").trim();
      return {
        ...entry,
        id,
        name: optionName(entry, id || collection.label),
        collectionLabel: collection.label,
        sourceFile
      };
    }

    function infoRows(option){
      const rows = [];

      if (option.rules_version) rows.push(["Regelversion", escapeHtml(option.rules_version)]);
      if (option.source) rows.push(["Quelle", escapeHtml(option.source)]);

      if (option.collectionLabel === "Klasse") {
        if (option.hit_die) rows.push(["Trefferwürfel", escapeHtml(String(option.hit_die))]);
        if (option.primary_abilities) rows.push(["Primäre Attribute", renderList(option.primary_abilities)]);
        if (option.proficiencies_text) rows.push(["Übungen", richText(String(option.proficiencies_text), { inlineOnly: true })]);
        else if (option.proficiencies) rows.push(["Übungen", renderList(option.proficiencies)]);
        if (option.multiclass_requirements) rows.push(["Mehrklassen-Voraussetzungen", renderList(option.multiclass_requirements)]);
      }

      if (option.collectionLabel === "Hintergrund") {
        if (option.prerequisite || option.requirement || option.voraussetzung) {
          rows.push(["Voraussetzung", richText(String(option.prerequisite || option.requirement || option.voraussetzung), { inlineOnly: true })]);
        }
        if (option.skill_proficiencies) rows.push(["Fertigkeiten", renderList(option.skill_proficiencies)]);
        if (option.tool_proficiencies) rows.push(["Werkzeuge", renderList(option.tool_proficiencies)]);
        if (option.languages) rows.push(["Sprachen", renderList(option.languages)]);
        if (option.equipment || option.starting_equipment) rows.push(["Ausrüstung", renderList(option.equipment || option.starting_equipment)]);
      }

      if (option.collectionLabel === "Talent") {
        const prerequisite = option.prerequisite || option.requirement || option.voraussetzung || (Array.isArray(option.prerequisites) ? option.prerequisites.join(", ") : "");
        if (prerequisite) rows.push(["Voraussetzung", richText(String(prerequisite), { inlineOnly: true })]);
        if (option.category) rows.push(["Kategorie", escapeHtml(String(option.category))]);
        if (option.level) rows.push(["Stufe", escapeHtml(String(option.level))]);
      }

      if (option.collectionLabel === "Volk") {
        if (option.size) rows.push(["Größe", renderList(option.size)]);
        if (option.creature_type) rows.push(["Kreaturentyp", renderList(option.creature_type)]);
        if (option.speed) rows.push(["Bewegung", renderList(option.speed)]);
        if (option.languages) rows.push(["Sprachen", renderList(option.languages)]);
        if (option.senses) rows.push(["Sinne", renderList(option.senses)]);
      }

      return rows;
    }

    function renderSubclasses(option){
      if (option.collectionLabel !== "Klasse" || !Array.isArray(option.subclasses) || !option.subclasses.length) return "";
      return `
        <div class="mini-box" style="margin-top:12px;">
          <div class="mini-box-title">Unterklassen</div>
          <div class="mini-box-text">${richText(subclassLinkList(option), { inlineOnly: true })}</div>
        </div>
      `;
    }

    async function loadOptionFile(collection, file){
      try {
        const response = await fetch(`${collection.basePath}/${file}`, { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const entry = await response.json();
        return normalizeOption(entry, collection, file);
      } catch (error) {
        console.warn(`${file} konnte nicht geladen werden.`, error);
        return null;
      }
    }

    const params = new URLSearchParams(location.search);
    const type = params.get("type") || "";
    const id = params.get("id") || "";
    const collection = COLLECTIONS[type];

    if (!collection || !id) {
      view.innerHTML = "<p>Fehlende oder unbekannte Charakteroption.</p>";
      throw new Error("Fehlende Charakteroption");
    }

    let files = [];
    let entries = [];
    try {
      files = await loadIndex(collection.indexPath);
      entries = (await Promise.all(files.map(file => loadOptionFile(collection, file)))).filter(Boolean);
    } catch (error) {
      console.warn("Charakteroptionen konnten nicht geladen werden.", error);
    }

    try {
      for (const [kind, definition] of Object.entries(LOOKUP_COLLECTIONS)) {
        const lookupFiles = await loadIndex(definition.indexPath);
        const lookupEntries = await loadMany(definition.basePath, lookupFiles);
        optionLookups[kind] = buildLookupIndex(lookupEntries.map(entry => ({
          id: entry?.id || entry?.slug || slugify(entry?.name || entry?.title || entry?.titel || entry?.label || ""),
          name: entry?.name || entry?.title || entry?.titel || entry?.label || entry?.id || entry?.slug || "",
          aliases: entry?.aliases
        })));
      }
    } catch (error) {
      console.warn("Charakteroption-Lookups konnten nicht aufgebaut werden.", error);
    }

    const option = entries.find(entry => String(entry.id).toLowerCase() === id.toLowerCase())
      || entries.find(entry => String(entry.name).toLowerCase() === id.toLowerCase())
      || entries.find(entry => String(entry.sourceFile).toLowerCase() === id.toLowerCase());

    if (!option) {
      view.innerHTML = `<p>${escapeHtml(collection.label)} nicht gefunden: <code>${escapeHtml(id)}</code></p>`;
      throw new Error("Charakteroption nicht gefunden");
    }

    titleEl.textContent = option.name || collection.label;

    const description = option.html || option.description_html || option.entries || option.text || option.description || option.beschreibung || option.summary || "";
    const rows = infoRows(option);

    view.innerHTML = `
      <h1>${escapeHtml(option.name)}</h1>
      <p class="muted">${escapeHtml(option.collectionLabel)}${option.source ? " - " + escapeHtml(option.source) : ""}</p>

      ${rows.length ? `<div class="mini-box">
        <div class="mini-box-title">Werte</div>
        <div class="mini-box-text">
          ${rows.map(([label, value]) => `<div><b>${escapeHtml(label)}:</b> ${value}</div>`).join("")}
        </div>
      </div>` : ""}

      ${renderSubclasses(option)}

      ${description ? `<div class="mini-box" style="margin-top:12px;">
        <div class="mini-box-title">Beschreibung</div>
        <div class="mini-box-text">${renderDescription(option, description)}</div>
      </div>` : ""}
    `;
  </script>
</body>
</html>
