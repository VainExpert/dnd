<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Handout</title>
  <link rel="stylesheet" href="../styles.css?v=theme-20260422"/>
  <script src="../theme.js?v=theme-20260422"></script>
  <style>
    .handout-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
    .handout-page{max-width:820px;margin:0 auto;background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:8px;padding:22px}
    .handout-image{max-width:100%;border-radius:8px;margin:10px 0 16px}
    .handout-text{font-size:17px;line-height:1.65;white-space:pre-wrap}
    .handout-links{display:grid;gap:6px;margin-top:16px}
    @media print{
      body{background:#fff!important;color:#000!important}
      .topbar,.sidebar,nav,.handout-actions,#nav,.site-nav{display:none!important}
      .main,.content{max-width:none!important;margin:0!important;padding:0!important}
      .handout-page{border:0;background:#fff;padding:0}
      a{color:#000}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title" id="pageTitle">Handout</div>
      <div class="subtitle">Spieleransicht</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="content">
        <div class="handout-actions">
          <button class="select" id="print" type="button">Drucken / PDF</button>
        </div>
        <article class="handout-page" id="handout"></article>
      </div>
    </main>
  </div>

  <script src="../nav.js"></script>
  <script type="module">
    import { escapeHtml, renderRichText } from "../lib.js";

    const params = new URLSearchParams(location.search);
    const title = params.get("title") || "Handout";
    const text = params.get("text") || "";
    const image = params.get("img") || params.get("image") || "";
    const links = params.getAll("link")
      .map(value => {
        const [label, url] = String(value).split("|");
        return { label: label || url || "", url: url || label || "" };
      })
      .filter(link => link.label && link.url);

    function hasSecretMarker(value){
      return /\b(GM|SL|DM|Geheimnis|Nur SL|Nur GM|privat)\b/i.test(String(value || ""));
    }

    document.getElementById("pageTitle").textContent = title;
    document.title = title;
    document.getElementById("handout").innerHTML = `
      <h1>${escapeHtml(title)}</h1>
      ${image && !hasSecretMarker(image) ? `<img class="handout-image" src="${escapeHtml(image)}" alt="${escapeHtml(title)}"/>` : ""}
      <div class="handout-text">${text && !hasSecretMarker(text) ? renderRichText(text) : "Keine öffentlichen Inhalte hinterlegt."}</div>
      ${links.length ? `<div class="handout-links">${links.filter(link => !hasSecretMarker(link.label) && !hasSecretMarker(link.url)).map(link => `<a href="${escapeHtml(link.url)}">${escapeHtml(link.label)}</a>`).join("")}</div>` : ""}
    `;
    document.getElementById("print").addEventListener("click", () => window.print());
  </script>
</body>
</html>
