<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gegenstand</title>
  <link rel="stylesheet" href="../../styles.css"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title" id="title">Gegenstand</div>
      <div class="subtitle"><a href="./items.html">← Zurück zu allen Gegenständen</a> • <a href="./vendors.html">Händler-Sortimente</a> • <a href="../../index.html">Startseite</a></div>
    </div>
  </header>

  <main class="main">
    <div class="content" style="max-width:900px;">
      <div id="view"></div>
    </div>
  </main>

  <script type="module">
    import { escapeHtml, loadIndex, loadMany, normalizeItem } from "../../lib.js?v=2026-04-20-vendor-filter";

    const view = document.getElementById("view");
    const titleEl = document.getElementById("title");

    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      view.innerHTML = "<p>Fehlende Gegenstands-ID.</p>";
      throw new Error("Fehlende Gegenstands-ID");
    }

    const files = await loadIndex("../../data/items/index.json");
    const items = (await loadMany("../../data/items", files)).map(normalizeItem);

    const item =
      items.find(i => (i.id || "").toLowerCase() === id.toLowerCase()) ||
      items.find(i => (i.name || "").toLowerCase() === id.toLowerCase());

    if (!item) {
      view.innerHTML = `<p>Gegenstand nicht gefunden: <code>${escapeHtml(id)}</code></p>`;
      throw new Error("Gegenstand nicht gefunden");
    }

    titleEl.textContent = item.name || "Gegenstand";

    function weightDisplay(entry){
      const weight = entry.weight;
      if (weight == null || weight === "") return "";
      if (typeof weight === "number") return weight > 0 ? escapeHtml(String(weight)) : "";
      if (typeof weight === "string") {
        const trimmed = weight.trim();
        const match = trimmed.match(/^-?\d+(?:[.,]\d+)?/);
        if (!match) return escapeHtml(trimmed);
        const numeric = Number(match[0].replace(",", "."));
        return Number.isFinite(numeric) && numeric > 0 ? escapeHtml(trimmed) : "";
      }
      if (typeof weight === "object") {
        const rawValue = weight.value ?? weight.amount;
        const numeric = Number(rawValue);
        if (!Number.isFinite(numeric) || numeric <= 0) return "";
        const unit = String(weight.unit ?? "").trim();
        return escapeHtml([String(rawValue), unit].filter(Boolean).join(" ").trim());
      }
      return "";
    }

    function attunementDisplay(entry){
      const text = String(entry.attunement_text ?? "").trim();
      return text || "Ja";
    }

    const weight = weightDisplay(item);
    const vendors = (item.vendors ?? []).map(escapeHtml).join(", ");

    const effectHtml = item.html
      ? `<div class="mini-box-text">${item.html}</div>`
      : (item.text ? `<div class="mini-box-text">${escapeHtml(item.text).replaceAll("\n","<br/>")}</div>` : "");

    view.innerHTML = `
      <h1>${escapeHtml(item.name)}</h1>
      <p class="muted">${escapeHtml(item.type ?? "Item")}${item.rarity ? " • " + escapeHtml(item.rarity) : ""}</p>

      <div class="mini-box">
        <div class="mini-box-title">Werte</div>
        <div class="mini-box-text">
          ${item.requires_attunement ? `<div><b>Bindung:</b> ${escapeHtml(attunementDisplay(item))}</div>` : ""}
          ${item.price ? `<div><b>Preis:</b> ${escapeHtml(item.price)}</div>` : ""}
          ${weight ? `<div><b>Gewicht:</b> ${weight}</div>` : ""}
          ${vendors ? `<div><b>Händler:</b> ${vendors}</div>` : ""}
        </div>
      </div>

      ${effectHtml ? `<div class="mini-box" style="margin-top:12px;">
        <div class="mini-box-title">Beschreibung</div>
        ${effectHtml}
      </div>` : ""}

      ${item.source ? `<p class="muted" style="margin-top:12px;"><b>Quelle:</b> ${escapeHtml(item.source)}</p>` : ""}
    `;
  </script>
</body>
</html>
