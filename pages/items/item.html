<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gegenstand</title>
  <link rel="stylesheet" href="../../styles.css?v=theme-20260422"/>
  <script src="../../theme.js?v=theme-20260422"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title" id="title">Gegenstand</div>
    </div>
  </header>

  <main class="main">
    <div class="content" style="max-width:900px;">
      <div id="view"></div>
    </div>
  </main>

  <script src="../../nav.js"></script>
  <script type="module">
    import {
      escapeHtml,
      loadIndex,
      loadMany,
      normalizeItem,
      normalizeSpell,
      buildLookupIndex,
      renderRichText,
      linkifyRefs
    } from "../../lib.js?v=2026-04-20-vendor-filter";

    const view = document.getElementById("view");
    const titleEl = document.getElementById("title");

    const FIELD_LABELS = {
      id: "ID",
      type: "Typ",
      item_category: "Kategorie",
      rarity: "Seltenheit",
      source: "Quelle",
      rules_version: "Regelversion",
      price: "Preis",
      weight: "Gewicht",
      requires_attunement: "Bindung",
      consumable: "Verbrauchbar",
      equippable: "Ausrüstbar",
      equip_slot: "Slot",
      stackable: "Stapelbar",
      vendors: "Händler",
      tags: "Tags",
      armor: "Rüstung",
      weapon: "Waffe",
      charges: "Aufladungen",
      uses: "Nutzungen",
      modifiers: "Modifikatoren",
      granted_spell_ids: "Zauber",
      granted_action_ids: "Aktionen",
      effects: "Effekte",
      contained_item_ids: "Enthaltene Gegenstände",
      use_cost: "Aktivierung",
      text: "Beschreibung",
      html: "Beschreibung",
      description_html: "Beschreibung"
    };

    const DETAIL_FIELD_ORDER = [
      "id",
      "type",
      "item_category",
      "rarity",
      "source",
      "rules_version",
      "price",
      "weight",
      "requires_attunement",
      "consumable",
      "equippable",
      "equip_slot",
      "stackable",
      "vendors",
      "tags",
      "armor",
      "weapon",
      "charges",
      "uses",
      "use_cost",
      "modifiers",
      "effects",
      "granted_spell_ids",
      "granted_action_ids",
      "contained_item_ids"
    ];

    function labelFor(key){
      return FIELD_LABELS[key] || String(key ?? "").replaceAll("_", " ");
    }

    function isMeaningful(value){
      if (value == null) return false;
      if (typeof value === "string") return value.trim() !== "";
      if (typeof value === "number") return Number.isFinite(value);
      if (typeof value === "boolean") return value;
      if (Array.isArray(value)) return value.some(isMeaningful);
      if (typeof value === "object") return Object.values(value).some(isMeaningful);
      return true;
    }

    function attunementDisplay(entry){
      const text = String(entry.attunement_text ?? "").trim();
      return text || "Ja";
    }

    function kindDisplay(entry){
      const type = String(entry.type ?? "").trim();
      const category = String(entry.item_category ?? "").trim();
      if (!type) return category || "Item";
      if (!category || category.toLowerCase() === type.toLowerCase()) return type;
      if (type.toLowerCase() === "item") return category;
      return `${type} - ${category}`;
    }

    function renderLinkedRefs(ids, kind, lookup){
      return ids
        .map(entryId => linkifyRefs(`[[${kind}:${entryId}]]`, { lookups: { [kind]: lookup } }))
        .join(", ");
    }

    function renderObjectSummary(value, lookups){
      const richOptions = { lookups: { item: lookups.item, spell: lookups.spell }, inlineOnly: true };
      return Object.entries(value)
        .filter(([, entry]) => isMeaningful(entry))
        .map(([subKey, entry]) => `${escapeHtml(labelFor(subKey))}: ${renderRichText(String(entry), richOptions)}`)
        .join(" &bull; ");
    }

    function renderFieldValue(item, value, key, lookups){
      const richOptions = { lookups: { item: lookups.item, spell: lookups.spell }, inlineOnly: true };

      if (key === "requires_attunement") return renderRichText(attunementDisplay(item), richOptions);
      if (key === "vendors" || key === "tags") return (value ?? []).map(entry => renderRichText(String(entry), richOptions)).join(", ");
      if (key === "granted_spell_ids") return renderLinkedRefs(value ?? [], "spell", lookups.spell);
      if (key === "contained_item_ids") return renderLinkedRefs(value ?? [], "item", lookups.item);
      if (key === "modifiers" || key === "effects" || key === "granted_action_ids") return (value ?? []).map(entry => renderRichText(String(entry), richOptions)).join(", ");

      if (key === "charges" || key === "uses") {
        const parts = [];
        if (isMeaningful(value?.max)) parts.push(`Max. ${renderRichText(String(value.max), richOptions)}`);
        if (isMeaningful(value?.recharge)) parts.push(`Regeneration: ${renderRichText(String(value.recharge), richOptions)}`);
        return parts.join(" &bull; ");
      }

      if (key === "armor" && value && typeof value === "object" && !Array.isArray(value)) {
        const parts = [];
        if (isMeaningful(value.type)) parts.push(`Typ: ${renderRichText(String(value.type), richOptions)}`);
        if (isMeaningful(value.base)) parts.push(`RK ${renderRichText(String(value.base), richOptions)}`);
        if (value.dex_bonus === true) parts.push("GE-Bonus");
        if (isMeaningful(value.max)) parts.push(`GE max. ${renderRichText(String(value.max), richOptions)}`);
        if (value.stealth_disadvantage === true) parts.push("Nachteil auf Heimlichkeit");
        return parts.join(" &bull; ");
      }

      if (typeof value === "boolean") return escapeHtml(value ? "Ja" : "Nein");
      if (Array.isArray(value)) return value.map(entry => renderRichText(String(entry), richOptions)).join(", ");
      if (value && typeof value === "object") return renderObjectSummary(value, lookups);
      return renderRichText(String(value ?? ""), richOptions);
    }

    function renderDetailRows(item, lookups){
      const orderedKeys = [
        ...DETAIL_FIELD_ORDER.filter(key => Object.prototype.hasOwnProperty.call(item, key)),
        ...Object.keys(item).filter(key => !DETAIL_FIELD_ORDER.includes(key) && !["text", "html", "description_html", "attunement_text"].includes(key))
      ];

      return orderedKeys
        .filter(key => isMeaningful(item[key]))
        .map(key => `<div><b>${escapeHtml(labelFor(key))}:</b> ${renderFieldValue(item, item[key], key, lookups)}</div>`)
        .join("");
    }

    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      view.innerHTML = "<p>Fehlende Gegenstands-ID.</p>";
      throw new Error("Fehlende Gegenstands-ID");
    }

    const itemFiles = await loadIndex("../../data/items/index.json");
    const items = (await loadMany("../../data/items", itemFiles)).map(normalizeItem);

    let spells = [];
    try {
      const spellFiles = await loadIndex("../../data/spells/index.json");
      spells = (await loadMany("../../data/spells", spellFiles)).map(normalizeSpell);
    } catch (error) {
      console.warn("Zauberdaten konnten fur die Item-Ansicht nicht geladen werden.", error);
    }

    const itemLookup = buildLookupIndex(items);
    const spellLookup = buildLookupIndex(spells);

    const item =
      items.find(entry => (entry.id || "").toLowerCase() === id.toLowerCase()) ||
      items.find(entry => (entry.name || "").toLowerCase() === id.toLowerCase());

    if (!item) {
      view.innerHTML = `<p>Gegenstand nicht gefunden: <code>${escapeHtml(id)}</code></p>`;
      throw new Error("Gegenstand nicht gefunden");
    }

    titleEl.textContent = item.name || "Gegenstand";

    const detailRows = renderDetailRows(item, { item: itemLookup, spell: spellLookup });
    const descriptionHtml = item.html
      ? `<div class="mini-box-text">${item.html}</div>`
      : (item.text ? `<div class="mini-box-text">${renderRichText(item.text, { lookups: { item: itemLookup, spell: spellLookup } })}</div>` : "");

    view.innerHTML = `
      <h1>${escapeHtml(item.name)}</h1>
      <p class="muted">${escapeHtml(kindDisplay(item))}${item.rarity ? " &bull; " + escapeHtml(item.rarity) : ""}</p>

      ${detailRows ? `<div class="mini-box">
        <div class="mini-box-title">Eigenschaften</div>
        <div class="mini-box-text">${detailRows}</div>
      </div>` : ""}

      ${descriptionHtml ? `<div class="mini-box" style="margin-top:12px;">
        <div class="mini-box-title">Beschreibung</div>
        ${descriptionHtml}
      </div>` : ""}
    `;
  </script>
</body>
</html>
