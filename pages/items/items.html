<body>

    </div>

      <input id="q" type="search" placeholder="Suchen..."/>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav">
        <div class="group">
          <div class="group-title">Start</div>
          <a href="../../index.html">Startseite</a>
          <a href="../../index.html#content/house-rules/index.md">Hausregeln</a>
          <a href="../../index.html#content/safety/index.md">Sicherheit</a>
          <a href="../../index.html#content/character-options/index.md">Charakteroptionen</a>
          <a href="../../index.html#content/recaps/index.md">Rückblicke</a>
        </div>

        <div class="group">
          <div class="group-title">Werkzeuge</div>
          <a href="../werkzeuge/tools.html">Zufallstabellen &amp; Generatoren</a>
          <a href="../werkzeuge/dice.html">Würfel</a>
          <a href="../werkzeuge/units.html">Einheitenumrechner</a>

        <div class="group">

          <a href="../bestiarium/bestiary.html">Bestiarium</a>

    <main class="main">
      <div class="content" style="max-width:1100px;">
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          <select id="type" class="select"><option value="">Alle Typen</option></select>
          <select id="rarity" class="select"><option value="">Alle Seltenheiten</option></select>
          <select id="vendor" class="select"><option value="">Alle Händler</option></select>
        </div>
        <div id="grid" class="card-grid"></div>
      </div>
    </main>
  </div>

  <script src="../../nav.js"></script>
  <script type="module">
    import { escapeHtml, loadIndex, loadMany, normalizeItem, renderRichText } from "../../lib.js?v=2026-04-20-vendor-filter";

    const grid = document.getElementById("grid");
    const qEl = document.getElementById("q");
    const typeEl = document.getElementById("type");
    const rarityEl = document.getElementById("rarity");
    const vendorEl = document.getElementById("vendor");

    function isMeaningful(value){
      if (value == null) return false;
      if (typeof value === "string") return value.trim() !== "";
      if (typeof value === "number") return Number.isFinite(value);
      if (typeof value === "boolean") return value;
      if (Array.isArray(value)) return value.some(isMeaningful);
      if (typeof value === "object") return Object.values(value).some(isMeaningful);
      return true;
    }

    function kindDisplay(item){
      const type = String(item.type ?? "").trim();
      const category = String(item.item_category ?? "").trim();
      if (!type) return category || "Item";
      if (!category || category.toLowerCase() === type.toLowerCase()) return type;
      if (type.toLowerCase() === "item") return category;
      return `${type} - ${category}`;
    }

    function attunementDisplay(item){
      const text = String(item.attunement_text ?? "").trim();
      return text || "Ja";
    }

    function excerpt(text, length = 220){
      const value = String(text ?? "").trim();
      if (!value) return "";
      return value.length > length ? `${value.slice(0, length - 1)}...` : value;
    }

    function vendorDisplay(item){
      const vendors = item.vendors ?? [];
      if (!vendors.length) return "";
      if (vendors.length === 1) return escapeHtml(vendors[0]);
      return escapeHtml(`${vendors[0]} +${vendors.length - 1}`);
    }

    function usageDisplay(item){
      const uses = item.uses;
      const charges = item.charges;
      if (isMeaningful(uses?.max) || isMeaningful(uses?.recharge)) {
        return [
          isMeaningful(uses?.max) ? `${uses.max} Nutzung${Number(uses.max) === 1 ? "" : "en"}` : "",
          isMeaningful(uses?.recharge) ? `Reset: ${uses.recharge}` : ""
        ].filter(Boolean).join(" - ");
      }
      if (isMeaningful(charges?.max) || isMeaningful(charges?.recharge)) {
        return [
          isMeaningful(charges?.max) ? `${charges.max} Aufladung${Number(charges.max) === 1 ? "" : "en"}` : "",
          isMeaningful(charges?.recharge) ? `Reset: ${charges.recharge}` : ""
        ].filter(Boolean).join(" - ");
      }
      return "";
    }

    function card(item){
      const id = item.id || item.name || "";
      const href = `./item.html?id=${encodeURIComponent(id)}`;
      const vendor = vendorDisplay(item);
      const usage = usageDisplay(item);
      const tagSummary = (item.tags ?? []).slice(0, 3).map(escapeHtml).join(", ");

      return `
        <div class="mini-card">
          <div class="mini-head">
            <div class="mini-title"><a href="${href}">${escapeHtml(item.name)}</a></div>
            <div class="mini-sub">${escapeHtml(kindDisplay(item))}${item.rarity ? " &bull; " + escapeHtml(item.rarity) : ""}</div>
            <div class="pillbar">
              ${item.requires_attunement ? `<span class="pill"><b>Bindung</b> ${escapeHtml(attunementDisplay(item))}</span>` : ""}
              ${item.price ? `<span class="pill"><b>Preis</b> ${escapeHtml(item.price)}</span>` : ""}
              ${usage ? `<span class="pill"><b>Nutzung</b> ${escapeHtml(usage)}</span>` : ""}
              ${vendor ? `<span class="pill"><b>Händler</b> ${vendor}</span>` : ""}
            </div>
          </div>
          <div class="mini-body">
            ${item.text ? `<div class="mini-box"><div class="mini-box-title">Effekt</div><div class="mini-box-text">${renderRichText(excerpt(item.text), { inlineOnly: true })}</div></div>` : ""}
            ${tagSummary ? `<div class="mini-footer muted">Tags: ${tagSummary}</div>` : ""}
            ${item.source ? `<div class="mini-footer muted">Quelle: ${escapeHtml(item.source)}</div>` : ""}
          </div>
        </div>
      `;
    }

    const itemFiles = await loadIndex("../../data/items/index.json");
    const items = (await loadMany("../../data/items", itemFiles)).map(normalizeItem);

    const types = Array.from(new Set(items.map(kindDisplay).filter(Boolean))).sort((a, b) => a.localeCompare(b));
    for (const type of types) {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = type;
      typeEl.appendChild(option);
    }

    const rarities = Array.from(new Set(items.map(item => item.rarity).filter(Boolean))).sort((a, b) => a.localeCompare(b));
    for (const rarity of rarities) {
      const option = document.createElement("option");
      option.value = rarity;
      option.textContent = rarity;
      rarityEl.appendChild(option);
    }

    const vendors = Array.from(new Set(items.flatMap(item => item.vendors ?? [])
      .filter(vendor => vendor && String(vendor).trim() !== "Beute")))
      .sort((a, b) => a.localeCompare(b));
    for (const vendor of vendors) {
      const option = document.createElement("option");
      option.value = vendor;
      option.textContent = vendor;
      vendorEl.appendChild(option);
    }

    function matches(item, query, type, rarity, vendor){
      const haystack = [
        item.id,
        item.name,
        item.type,
        item.item_category,
        item.rarity,
        item.text,
        item.source,
        item.use_cost,
        ...(item.tags ?? []),
        ...(item.modifiers ?? []),
        ...(item.effects ?? []),
        ...(item.vendors ?? [])
      ].join(" ").toLowerCase();

      if (query && !haystack.includes(query)) return false;
      if (type && kindDisplay(item) !== type) return false;
      if (rarity && (item.rarity ?? "") !== rarity) return false;
      if (vendor && !(item.vendors ?? []).includes(vendor)) return false;
      return true;
    }

    function render(){
      const query = (qEl.value || "").trim().toLowerCase();
      const type = typeEl.value;
      const rarity = rarityEl.value;
      const vendor = vendorEl.value;

      const filtered = items.filter(item => matches(item, query, type, rarity, vendor));
      grid.innerHTML = filtered.map(card).join("") || "<p>Keine Treffer.</p>";
    }

    qEl.addEventListener("input", render);
    typeEl.addEventListener("change", render);
    rarityEl.addEventListener("change", render);
    vendorEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
