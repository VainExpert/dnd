            ${showAbilities ? `
              <div class="mini-box" style="margin-top:12px;">
                <div class="mini-box-title">Attribute</div>
                <div class="mini-box-text">
                  <b>STR</b> ${ab.str ?? "-"} (${fmtSigned(mod(ab.str ?? 10))}) &bull;
                  <b>DEX</b> ${ab.dex ?? "-"} (${fmtSigned(mod(ab.dex ?? 10))}) &bull;
                  <b>CON</b> ${ab.con ?? "-"} (${fmtSigned(mod(ab.con ?? 10))}) &bull;
                  <b>INT</b> ${ab.int ?? "-"} (${fmtSigned(mod(ab.int ?? 10))}) &bull;
                  <b>WIS</b> ${ab.wis ?? "-"} (${fmtSigned(mod(ab.wis ?? 10))}) &bull;
                  <b>CHA</b> ${ab.cha ?? "-"} (${fmtSigned(mod(ab.cha ?? 10))})
                </div>
              </div>
            ` : ""}
            ${spellSections.length ? renderInfoBox("Zauber", renderSectionList("spell", spellSections, "../zauber/")) : ""}
            ${itemSections.length ? renderInfoBox("Gegenstände", renderSectionList("item", itemSections, "../items/")) : ""}
            ${publicFeatures.length ? renderInfoBox("Features", renderDefinitionList(publicFeatures)) : ""}
            ${publicNotes ? renderInfoBox("Notizen", renderMarkdownText(publicNotes, { lookups: { spell: spellLookup, item: itemLookup } })) : ""}
          </div>
        </div>
      `;
    }

    function flatItemNames(list){
      return publicList(list).map(item => `${item.quantity || item.qty || 1}x ${item.name || item.item_ref?.name || item.ref?.name || item.id || "Gegenstand"}`).join(", ");
    }

    function scalar(value){
      if (value == null || value === "") return "";
      if (Array.isArray(value)) return value.map(scalar).filter(Boolean).join(", ");
      if (typeof value === "object") return stripHtml(renderValue(value));
      return String(value);
    }

    function sheetLines(values, max = 12){
      return publicList(values).map(value => scalar(value).replace(/\s+/g, " ").trim()).filter(Boolean).slice(0, max);
    }

    function featureLines(group, max = 10){
      return sheetLines(features?.[group] || [], max);
    }

    function itemRows(values, max = 18){
      return publicList(values).slice(0, max).map(item => ({
        name: item.name || item.item_ref?.name || item.ref?.name || item.id || "",
        qty: item.quantity || item.qty || "",
        weight: item.weight ?? item.weight_value ?? ""
      }));
    }

    function renderRows(rows, emptyRows = 0){
      const html = rows.map(row => `<tr><td>${escapeHtml(row.name || "")}</td><td>${escapeHtml(row.qty || "")}</td><td>${escapeHtml(row.weight || "")}</td></tr>`).join("");
      const blanks = Array.from({ length: Math.max(0, emptyRows - rows.length) }, () => "<tr><td>&nbsp;</td><td></td><td></td></tr>").join("");
      return `<table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr><th align="left">Name</th><th align="left">Anz</th><th align="left">Gewicht</th></tr></thead><tbody>${html}${blanks}</tbody></table>`;
    }

    function spellSlotText(){
      const slots = spellcasting.spell_slots || {};
      return Object.entries(slots).map(([key, value]) => `${key.replace("level_", "")}: ${value?.max ?? value}`).join(" / ");
    }

    function renderTemplateSheet(){
      const proficiency = character.proficiency_bonus ?? character.proficiency?.bonus ?? "";
      const saves = character.ability_scores || {};
      const skillRows = Object.entries(character.skills || {}).filter(([, value]) => value != null).map(([key, value]) => `${key}: ${fmtSigned(Number(value) || 0)}`);
      const attacks = publicList(combat.attacks_and_cantrips).map(a => `${a.name || "Angriff"} ${a.attack_bonus != null ? fmtSigned(a.attack_bonus) : ""} ${a.damage || ""}`.trim());
      const actionText = combat.actions || {};
      const spellRefs = currentSpellRefs().map(ref => ref.name || ref.id).filter(Boolean);
      const equipmentRows = itemRows(equipment.items || [], 16);
      const attunedRows = itemRows(equipment.attuned_magic_items_listed || [], 8);
      const personalityRows = {
        traits: sheetLines(personality.traits || personality.personality_traits || [], 4).join("\n"),
        ideals: sheetLines(personality.ideals || [], 3).join("\n"),
        motivation: sheetLines(personality.motivation || personality.bonds || [], 3).join("\n"),
        flaws: sheetLines(personality.flaws || [], 3).join("\n")
      };
      const appearance = identity.appearance || {};
      const notes = hasSecretMarker(p.notes) ? "" : p.notes;
      view.innerHTML = `
        ${actionLinks()}
        <div class="sheet-pages">
          <article class="sheet-page sheet-template">
            <div class="sheet-title">
              <div class="sheet-box"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
              <div class="sheet-box"><h3>Klasse</h3><div>${escapeHtml([p.class, p.subclass].filter(Boolean).join(" / "))}</div></div>
              <div class="sheet-box"><h3>Level</h3><div class="sheet-value">${escapeHtml(p.level || "")}</div></div>
              <div class="sheet-box"><h3>Spieler</h3><div>${escapeHtml(p.player || "")}</div></div>
              <div class="sheet-box"><h3>Spezies</h3><div>${escapeHtml(p.race || "")}</div></div>
              <div class="sheet-box"><h3>Hintergrund</h3><div>${escapeHtml(p.background || "")}</div></div>
              <div class="sheet-box"><h3>Uebungsbonus</h3><div class="sheet-value">${proficiency === "" ? "" : fmtSigned(Number(proficiency) || 0)}</div></div>
              <div class="sheet-box"><h3>Weitere Sinne</h3><div>${escapeHtml(scalar(combat.senses || ""))}</div></div>
            </div>
            <div class="sheet-ability">
              ${["str","dex","con","int","wis","cha"].map(key => `<div class="sheet-box"><h3>${key.toUpperCase()}</h3><div class="sheet-value">${escapeHtml(ab[key] ?? "")}</div><div>${fmtSigned(mod(ab[key] ?? 10))}</div></div>`).join("")}
            </div>
            <div class="sheet-grid" style="margin-top:8px;">
              <div class="sheet-box span-2"><h3>RK</h3><div class="sheet-value">${escapeHtml(p.ac ?? "")}</div></div>
              <div class="sheet-box span-2"><h3>Initiative</h3><div class="sheet-value">${escapeHtml(combat.initiative != null ? fmtSigned(combat.initiative) : fmtSigned(mod(ab.dex ?? 10)))}</div></div>
              <div class="sheet-box span-2"><h3>Bewegung</h3><div class="sheet-value">${escapeHtml(p.speed || "")}</div></div>
              <div class="sheet-box span-3"><h3>HP</h3><div class="sheet-value">${escapeHtml(p.hp ?? "")}</div></div>
              <div class="sheet-box span-3"><h3>Trefferwuerfel</h3><div class="sheet-value">${escapeHtml(p.hit_dice || "")}</div></div>
              <div class="sheet-box span-6"><h3>Rettungswurf-Modifikatoren</h3><div class="sheet-lines">${escapeHtml(Object.entries(saves).map(([key, value]) => `${key}: ${fmtSigned(Number(value?.save ?? mod(value?.score ?? value ?? 10)) || 0)}`).join("\n"))}</div></div>
              <div class="sheet-box span-6"><h3>Fertigkeiten</h3><div class="sheet-lines">${escapeHtml(skillRows.join("\n"))}</div></div>
              <div class="sheet-box span-3"><h3>Ruestung</h3><div class="sheet-lines">${escapeHtml(scalar(proficiencies.armor || ""))}</div></div>
              <div class="sheet-box span-3"><h3>Waffen</h3><div class="sheet-lines">${escapeHtml(scalar(proficiencies.weapons || ""))}</div></div>
              <div class="sheet-box span-3"><h3>Werkzeuge</h3><div class="sheet-lines">${escapeHtml(scalar(proficiencies.tools || ""))}</div></div>
              <div class="sheet-box span-3"><h3>Sprachen</h3><div class="sheet-lines">${escapeHtml(scalar(proficiencies.languages || ""))}</div></div>
              <div class="sheet-box span-6"><h3>Aktionen</h3><div class="sheet-lines">${escapeHtml([`Standard: ${scalar(actionText.standard || "Angriff, Ausweichen, Helfen, Magie")}`, `Bonusaktionen: ${scalar(actionText.bonus_actions || "")}`, `Reaktionen: ${scalar(actionText.reactions || "Gelegenheitsangriff")}`, `Spezial: ${scalar(actionText.special || "")}`].join("\n"))}</div></div>
              <div class="sheet-box span-6"><h3>Angriffe / Zaubertricks</h3><div class="sheet-lines">${escapeHtml(attacks.join("\n"))}</div></div>
              <div class="sheet-box span-12"><h3>Merkmale</h3><div class="sheet-grid">
                <div class="span-3"><div class="sheet-muted">Klasse</div><ul class="sheet-list">${featureLines("class", 5).map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul></div>
                <div class="span-3"><div class="sheet-muted">Spezies</div><ul class="sheet-list">${featureLines("racial", 5).map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul></div>
                <div class="span-3"><div class="sheet-muted">Hintergrund</div><ul class="sheet-list">${featureLines("background", 5).map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul></div>
                <div class="span-3"><div class="sheet-muted">Talente / Magie</div><ul class="sheet-list">${featureLines("feats", 5).concat(featureLines("talents_and_magic_items_text", 5)).map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul></div>
              </div></div>
            </div>
          </article>

          <article class="sheet-page sheet-template">
            <div class="sheet-title">
              <div class="sheet-box"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
              <div class="sheet-box"><h3>Klasse</h3><div>${escapeHtml(p.class || "")}</div></div>
              <div class="sheet-box"><h3>Level</h3><div>${escapeHtml(p.level || "")}</div></div>
              <div class="sheet-box"><h3>Spieler</h3><div>${escapeHtml(p.player || "")}</div></div>
            </div>
            <div class="sheet-grid">
              <div class="sheet-box span-4"><h3>Waehrung</h3><div class="sheet-lines">${escapeHtml(scalar(equipment.currency || ""))}</div></div>
              <div class="sheet-box span-4"><h3>Gewicht</h3><div class="sheet-lines">${escapeHtml(scalar(equipment.weights || ""))}</div></div>
              <div class="sheet-box span-4"><h3>Eingestimmte magische Items</h3>${renderRows(attunedRows, 5)}</div>
              <div class="sheet-box span-12"><h3>Ausruestung</h3>${renderRows(equipmentRows, 18)}</div>
              <div class="sheet-box span-12"><h3>Zusaetzliche Ausruestung</h3>${renderRows(itemRows((equipment.additional_items || []).concat(dynamicInventoryEntries.map(entry => ({ name: entry.item?.name, qty: entry.qty, weight: entry.item?.weight }))), 18), 12)}</div>
            </div>
          </article>

          <article class="sheet-page sheet-template">
            <div class="sheet-title">
              <div class="sheet-box"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
              <div class="sheet-box"><h3>Klasse</h3><div>${escapeHtml(p.class || "")}</div></div>
              <div class="sheet-box"><h3>Level</h3><div>${escapeHtml(p.level || "")}</div></div>
              <div class="sheet-box"><h3>Spieler</h3><div>${escapeHtml(p.player || "")}</div></div>
            </div>
            <div class="sheet-grid">
              <div class="sheet-box span-4"><h3>Zusaetzliche Merkmale</h3><div class="sheet-lines">${escapeHtml(featureLines("subclass", 8).join("\n"))}</div></div>
              <div class="sheet-box span-4"><h3>Weitere Eigenschaften</h3><div class="sheet-lines">${escapeHtml(featureLines("racial", 8).join("\n"))}</div></div>
              <div class="sheet-box span-4"><h3>Weitere Talente</h3><div class="sheet-lines">${escapeHtml(featureLines("feats", 8).concat(featureLines("talents_and_magic_items_text", 8)).join("\n"))}</div></div>
              <div class="sheet-box span-12"><h3>Notizen</h3><div class="sheet-lines">${escapeHtml(notes)}</div></div>
            </div>
          </article>

          <article class="sheet-page sheet-template">
            <div class="sheet-title">
              <div class="sheet-box"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
              <div class="sheet-box"><h3>Ausrichtung</h3><div>${escapeHtml(identity.alignment || "")}</div></div>
              <div class="sheet-box"><h3>Glaube</h3><div>${escapeHtml(identity.deity || "")}</div></div>
              <div class="sheet-box"><h3>Geschlecht / Alter</h3><div>${escapeHtml([identity.gender, identity.age].filter(Boolean).join(" / "))}</div></div>
              <div class="sheet-box"><h3>Groessenklasse</h3><div>${escapeHtml(identity.size || "")}</div></div>
              <div class="sheet-box"><h3>Groesse / Gewicht</h3><div>${escapeHtml([identity.height ? `${identity.height} m` : "", identity.weight ? `${identity.weight} kg` : ""].filter(Boolean).join(" / "))}</div></div>
              <div class="sheet-box"><h3>Haut / Augen / Haar</h3><div>${escapeHtml([appearance.skin, appearance.eyes, appearance.hair].filter(Boolean).join(" / "))}</div></div>
              <div class="sheet-box"><h3>Organisationen</h3><div>${escapeHtml(scalar(identity.organizations || ""))}</div></div>
            </div>
            <div class="sheet-grid">
              <div class="sheet-box span-4"><h3>Persoenlichkeit</h3><div class="sheet-lines">${escapeHtml(personalityRows.traits)}</div></div>
              <div class="sheet-box span-4"><h3>Ideale</h3><div class="sheet-lines">${escapeHtml(personalityRows.ideals)}</div></div>
              <div class="sheet-box span-4"><h3>Motivation</h3><div class="sheet-lines">${escapeHtml(personalityRows.motivation)}</div></div>
              <div class="sheet-box span-4"><h3>Makel</h3><div class="sheet-lines">${escapeHtml(personalityRows.flaws)}</div></div>
              <div class="sheet-box span-4"><h3>Verbuendete</h3><div class="sheet-lines">${escapeHtml(scalar(backstory.allies || ""))}</div></div>
              <div class="sheet-box span-4"><h3>Aussehen</h3><div class="sheet-lines">${escapeHtml(scalar(identity.appearance || ""))}</div></div>
              <div class="sheet-box span-6"><h3>Hintergrundgeschichte</h3><div class="sheet-lines">${escapeHtml(scalar(backstory.summary || backstory))}</div></div>
              <div class="sheet-box span-6"><h3>Zusatznotizen</h3><div class="sheet-lines">${escapeHtml(notes)}</div></div>
            </div>
          </article>

          <article class="sheet-page sheet-template">
            <div class="sheet-title">
              <div class="sheet-box"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
              <div class="sheet-box"><h3>Zauberklasse</h3><div>${escapeHtml(spellcasting.spellcasting_class || p.class || "")}</div></div>
              <div class="sheet-box"><h3>Zauberfaehigkeit</h3><div>${escapeHtml([spellcasting.spellcasting_ability, spellcasting.spellcasting_ability_mod != null ? `(${fmtSigned(spellcasting.spellcasting_ability_mod)})` : ""].filter(Boolean).join(" "))}</div></div>
              <div class="sheet-box"><h3>SG / Angriff</h3><div>${escapeHtml([spellcasting.spell_save_dc ? `SG ${spellcasting.spell_save_dc}` : "", spellcasting.spell_attack_bonus != null ? fmtSigned(spellcasting.spell_attack_bonus) : ""].filter(Boolean).join(" / "))}</div></div>
            </div>
            <div class="sheet-grid">
              <div class="sheet-box span-4"><h3>Zauberplaetze</h3><div class="sheet-lines">${escapeHtml(spellSlotText())}</div></div>
              <div class="sheet-box span-8"><h3>Zaubertricks</h3><div class="sheet-lines">${escapeHtml((spellcasting.cantrips || []).map(ref => ref.name || ref.id).join("\n"))}</div></div>
              <div class="sheet-box span-12"><h3>Bekannte / vorbereitete Zauber</h3><div class="sheet-lines">${escapeHtml(spellRefs.join("\n"))}</div></div>
            </div>
          </article>
        </div>
      `;
      document.getElementById("printSheet")?.addEventListener("click", () => window.print());
    }

    function renderSheet(){
      return renderTemplateSheet();
      const proficiency = character.proficiency_bonus ?? character.proficiency?.bonus ?? "";
      const saves = character.ability_scores || {};
      const skillRows = Object.entries(character.skills || {}).filter(([, value]) => value != null).map(([key, value]) => `${key}: ${fmtSigned(Number(value) || 0)}`).join("; ");
      const attacks = publicList(combat.attacks_and_cantrips).map(a => `${a.name || "Angriff"} ${a.attack_bonus != null ? fmtSigned(a.attack_bonus) : ""} ${a.damage || ""}`.trim()).join("; ");
      const featureText = publicEntries(Object.entries(features || {})).map(([key, value]) => `${formatLabel(key)}: ${stripHtml(renderValue(value))}`).join("\n");
      const spellsText = currentSpellRefs().map(ref => ref.name || ref.id).join(", ");
      view.innerHTML = `
        ${actionLinks()}
        <article class="sheet-page">
          <div class="sheet-grid">
            <div class="sheet-box span-4"><h3>Name</h3><div class="sheet-value">${escapeHtml(p.name || "")}</div></div>
            <div class="sheet-box span-2"><h3>Spieler</h3><div>${escapeHtml(p.player || "")}</div></div>
            <div class="sheet-box span-2"><h3>Volk</h3><div>${escapeHtml(p.race || "")}</div></div>
            <div class="sheet-box span-2"><h3>Hintergrund</h3><div>${escapeHtml(p.background || "")}</div></div>
            <div class="sheet-box span-2"><h3>Klasse</h3><div>${escapeHtml([p.class, p.subclass].filter(Boolean).join(" / "))}</div><div>Stufe ${escapeHtml(p.level || "")}</div></div>
            ${["str","dex","con","int","wis","cha"].map(key => `<div class="sheet-box span-2"><h3>${key.toUpperCase()}</h3><div class="sheet-value">${escapeHtml(ab[key] ?? "")}</div><div>${fmtSigned(mod(ab[key] ?? 10))}</div></div>`).join("")}
            <div class="sheet-box span-2"><h3>Übungsbonus</h3><div class="sheet-value">${proficiency === "" ? "" : fmtSigned(Number(proficiency) || 0)}</div></div>
            <div class="sheet-box span-2"><h3>RK</h3><div class="sheet-value">${escapeHtml(p.ac ?? "")}</div></div>
            <div class="sheet-box span-2"><h3>Initiative</h3><div class="sheet-value">${escapeHtml(combat.initiative != null ? fmtSigned(combat.initiative) : fmtSigned(mod(ab.dex ?? 10)))}</div></div>
            <div class="sheet-box span-2"><h3>Bewegung</h3><div class="sheet-value">${escapeHtml(p.speed || "")}</div></div>
            <div class="sheet-box span-2"><h3>HP</h3><div class="sheet-value">${escapeHtml(p.hp ?? "")}</div></div>
            <div class="sheet-box span-2"><h3>Trefferwürfel</h3><div>${escapeHtml(p.hit_dice || "")}</div></div>
            <div class="sheet-box span-6"><h3>Rettungswürfe</h3><div class="sheet-small">${escapeHtml(Object.entries(saves).map(([key, value]) => `${key}: ${fmtSigned(Number(value?.save ?? mod(value?.score ?? value ?? 10)) || 0)}`).join("; "))}</div></div>
            <div class="sheet-box span-6"><h3>Fertigkeiten</h3><div class="sheet-small">${escapeHtml(skillRows)}</div></div>
            <div class="sheet-box span-6"><h3>Angriffe / Zaubertricks</h3><div class="sheet-small">${escapeHtml(attacks)}</div></div>
            <div class="sheet-box span-6"><h3>Ausrüstung</h3><div class="sheet-small">${escapeHtml(flatItemNames(equipment.items || []))}</div></div>
            <div class="sheet-box span-8"><h3>Features</h3><div class="sheet-small" style="white-space:pre-wrap;">${escapeHtml(featureText)}</div></div>
            <div class="sheet-box span-4"><h3>Zauberübersicht</h3><div class="sheet-small">${escapeHtml(spellsText)}</div></div>
          </div>
        </article>
      `;
      document.getElementById("printSheet")?.addEventListener("click", () => window.print());
    }

    function stripHtml(html){
      const tmp = document.createElement("div");
      tmp.innerHTML = html || "";
      return tmp.textContent || tmp.innerText || "";
    }

    const character = p.character || {};
    const identity = character.identity || {};
    const combat = character.combat || {};
    const spellcasting = character.spellcasting || {};
    const equipment = character.equipment || {};
    const proficiencies = character.proficiencies || {};
    const features = character.features || {};
    const personality = character.personality || {};
    const backstory = character.backstory || {};
    const dynamicInventoryEntries = readDynamicInventoryEntries(p);
    const dynamicInventoryHtml = renderDynamicInventory(dynamicInventoryEntries);
    const dynamicWeaponsHtml = renderDynamicWeapons(dynamicInventoryEntries);
    const dynamicActionsHtml = renderDynamicActions(dynamicInventoryEntries);
    const dynamicSpellsHtml = renderDynamicSpells(dynamicInventoryEntries);
    const characterInventoryEditorHtml = renderCharacterInventoryEditor();
    const resourceList = collectResources({ spellcasting, features, inventoryEntries: dynamicInventoryEntries });
    const resourceTrackerHtml = renderResourceTracker(resourceList);

    const identityDetails = renderDefinitionList(Object.entries(identity).filter(([key]) => !["name", "player_name", "class", "race"].includes(key)));
    const combatDetails = renderDefinitionList(Object.entries(combat).filter(([key]) => key !== "attacks_and_cantrips"));
    const spellcastingDetails = renderDefinitionList(Object.entries(spellcasting));
    const equipmentDetails = renderDefinitionList(Object.entries(equipment).filter(([key]) => !["items", "currency", "attuned_magic_items_listed"].includes(key)));
    const levelUpHtml = renderLevelUpPanel(selectedClassData);
    const rawSections = [
      ["Identität", identityDetails],
      ["Kampf", combatDetails],
      ["Angriffe und Zaubertricks", renderAttacks(combat.attacks_and_cantrips)],
      ["Übungen", renderValue(proficiencies)],
      ["Zauberwirken", spellcastingDetails],
      ["Dynamische Waffen", dynamicWeaponsHtml],
      ["Dynamische Item-Aktionen", dynamicActionsHtml],
      ["Dynamische Item-Zauber", dynamicSpellsHtml],
      ["Features", renderValue(features)],
      ["Dynamisches Inventar", dynamicInventoryHtml],
      ["Inventar", [renderCurrency(equipment.currency), renderInventory(equipment.items), renderValue(equipment.attuned_magic_items_listed, "item")].filter(Boolean).join("<div style=\"height:10px;\"></div>")],
      ["Ausrüstungsdetails", equipmentDetails],
      ["Persönlichkeit", renderValue(personality)],
      ["Hintergrundgeschichte", renderValue(backstory)]
    ];

    if (isSheetView) {
      renderSheet();
    } else if (isPlayerView) {
      renderPublicPc();
    } else {
      view.innerHTML = `
      ${actionLinks()}
      <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
        ${portrait}
        <div style="flex:1;min-width:260px;">
          <h1 style="margin:0;">${escapeHtml(p.name)}</h1>
          <p class="muted" style="margin:6px 0 0 0;">${escapeHtml(subtitle || (p.player ? `Spieler: ${p.player}` : ""))}</p>

          <div class="mini-box" style="margin-top:12px;">
            <div class="mini-box-title">Werte</div>
            <div class="mini-box-text">
              ${p.ac != null ? `<div><b>AC:</b> ${escapeHtml(p.ac)}</div>` : ""}
              ${p.hp != null ? `<div><b>HP:</b> ${escapeHtml(p.hp)}</div>` : ""}
              ${p.hit_dice ? `<div><b>Trefferwürfel:</b> ${formatScalar(p.hit_dice, "hit_dice")}</div>` : ""}
              ${p.speed != null ? `<div><b>Bewegung:</b> ${escapeHtml(p.speed)}</div>` : ""}
              ${p.player ? `<div><b>Spieler:</b> ${escapeHtml(p.player)}</div>` : ""}
            </div>
          </div>

          ${resourceTrackerHtml}

          ${characterInventoryEditorHtml}

          ${levelUpHtml}

          ${showAbilities ? `
            <div class="mini-box" style="margin-top:12px;">
              <div class="mini-box-title">Attribute</div>
              <div class="mini-box-text">
                <div>
                  <b>STR</b> ${ab.str ?? "-"} (${fmtSigned(mod(ab.str ?? 10))}) &bull;
                  <b>DEX</b> ${ab.dex ?? "-"} (${fmtSigned(mod(ab.dex ?? 10))}) &bull;
                  <b>CON</b> ${ab.con ?? "-"} (${fmtSigned(mod(ab.con ?? 10))}) &bull;
                  <b>INT</b> ${ab.int ?? "-"} (${fmtSigned(mod(ab.int ?? 10))}) &bull;
                  <b>WIS</b> ${ab.wis ?? "-"} (${fmtSigned(mod(ab.wis ?? 10))}) &bull;
                  <b>CHA</b> ${ab.cha ?? "-"} (${fmtSigned(mod(ab.cha ?? 10))})
                </div>
              </div>
            </div>
          ` : ""}

          ${spellSections.length ? `
            <div class="mini-box" style="margin-top:12px;">
              <div class="mini-box-title">Zauber</div>
              <div class="mini-box-text">
                ${renderSectionList("spell", spellSections, "../zauber/")}
              </div>
            </div>
          ` : ""}

          ${itemSections.length ? `
            <div class="mini-box" style="margin-top:12px;">
              <div class="mini-box-title">Gegenstände</div>
              <div class="mini-box-text">
                ${renderSectionList("item", itemSections, "../items/")}
              </div>
            </div>
          ` : ""}

          ${p.notes ? `
            <div class="mini-box" style="margin-top:12px;">
              <div class="mini-box-title">Notizen</div>
              <div class="mini-box-text">${renderMarkdownText(p.notes, { lookups: { spell: spellLookup, item: itemLookup } })}</div>
            </div>
          ` : ""}
        </div>
      </div>

      <div style="margin-top:20px;">
        <h2>Alle Charakterdaten</h2>
        ${rawSections.map(([sectionTitle, html]) => renderInfoBox(sectionTitle, html)).join("")}
      </div>
    `;
      bindLevelUpPanel();
      bindResourceTracker(resourceList);
      bindCharacterInventoryEditor();
    }
  </script>
</body>
</html>
