<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NSC/Monster erstellen</title>
  <link rel="stylesheet" href="../../styles.css?v=theme-20260422"/>
  <script src="../../theme.js?v=theme-20260422"></script>
  <script src="../../nav.js" defer></script>
  <style>
    .builder-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.85fr);gap:14px;align-items:start}
    .builder-panel{border:1px solid var(--rule);border-radius:8px;background:rgba(255,255,255,.025);padding:14px}
    .builder-panel h2{margin-top:22px}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
    .form-field{display:grid;gap:5px;color:var(--muted);font-size:13px}
    .ability-grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:8px}
    .ability-card{border:1px solid var(--rule);border-radius:8px;padding:8px;background:rgba(255,255,255,.025)}
    .ability-card label{display:grid;gap:5px;color:var(--muted);font-size:12px}
    .ability-card input[type="number"]{width:100%}
    .row-list{display:grid;gap:8px}
    .row-item{display:grid;grid-template-columns:minmax(120px,.35fr) minmax(0,1fr) auto;gap:8px;align-items:start}
    .statblock{border:1px solid var(--rule);border-radius:8px;padding:14px;background:rgba(255,255,255,.025);line-height:1.45}
    .stat-title{font-size:24px;font-weight:800}
    .stat-sub{color:var(--muted);margin-bottom:10px}
    .stat-line{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
    .json-box{min-height:300px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .import-box{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .btn{padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:#0b0e16;color:var(--text);cursor:pointer}
    .btn:hover{border-color:rgba(225,91,79,.35);background:rgba(225,91,79,.12)}
    .builder-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    @media (max-width:900px){.builder-shell{grid-template-columns:1fr}.ability-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row-item{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">NSC/Monster erstellen</div>
      <div class="subtitle">Statblock, Standardarray, JSON-Export</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="content" style="max-width:1200px;">
        <div class="builder-shell">
          <section class="builder-panel">
            <h1>Kreatur</h1>
            <div class="form-grid">
              <label class="form-field">Name <input id="name" class="select" value="Neue Kreatur"/></label>
              <label class="form-field">Art <select id="kind" class="select"><option value="monster">Monster</option><option value="npc">NSC</option></select></label>
              <label class="form-field">Groesse <select id="size" class="select"><option>winzig</option><option>klein</option><option selected>mittel</option><option>gross</option><option>riesig</option><option>gigantisch</option></select></label>
              <label class="form-field">Kreaturentyp <input id="type" class="select" value="Humanoid"/></label>
              <label class="form-field">Gesinnung <input id="alignment" class="select" value="neutral"/></label>
              <label class="form-field">HG <select id="cr" class="select"></select></label>
              <label class="form-field">RK <input id="ac" class="select" type="number" min="1" value="12"/></label>
              <label class="form-field">TP <input id="hp" class="select" type="number" min="1" value="11"/></label>
              <label class="form-field">TW-Formel <input id="hpFormula" class="select" value="2d8 + 2"/></label>
              <label class="form-field">Bewegung in m <input id="speed" class="select" type="number" min="0" value="9"/></label>
            </div>

            <h2>Werte</h2>
            <label class="form-field" style="margin-bottom:10px;">Quelle der Anpassungen <input id="abilitySource" class="select" placeholder="z.B. Volk, Template, Rolle, eigene Setzung"/></label>
            <div id="abilities" class="ability-grid"></div>

            <h2>Details</h2>
            <div class="form-grid">
              <label class="form-field">Rettungswürfe <input id="saves" class="select" placeholder="DEX +4, WIS +2"/></label>
              <label class="form-field">Fertigkeiten <input id="skills" class="select" placeholder="Wahrnehmung +4"/></label>
              <label class="form-field">Sinne <input id="senses" class="select" placeholder="Passive Wahrnehmung 12"/></label>
              <label class="form-field">Sprachen <input id="languages" class="select" placeholder="Gemeinsprache"/></label>
            </div>

            <h2>Eigenschaften</h2>
            <div id="traits" class="row-list"></div>
            <div class="builder-actions" style="margin-top:8px;"><button id="addTrait" class="btn" type="button">Eigenschaft hinzufügen</button></div>

            <h2>Aktionen</h2>
            <div id="actions" class="row-list"></div>
            <div class="builder-actions" style="margin-top:8px;"><button id="addAction" class="btn" type="button">Aktion hinzufügen</button></div>

            <h2>Notizen</h2>
            <textarea id="notes" class="select" rows="5"></textarea>

            <h2>Import / Bearbeiten</h2>
            <div class="choice-box">
              <label class="form-field">JSON-Datei <input id="importFile" class="select" type="file" accept="application/json,.json"/></label>
              <label class="form-field">JSON einfügen <textarea id="importText" class="select import-box" placeholder='{"name": "Kreatur", "armor_class": 12}'></textarea></label>
              <div class="builder-actions">
                <button id="importJson" class="btn" type="button">JSON importieren</button>
                <button id="resetForm" class="btn" type="button">Formular leeren</button>
              </div>
              <div id="importStatus" class="muted"></div>
            </div>
          </section>

          <aside class="builder-panel">
            <h2 style="margin-top:0">Vorschau</h2>
            <div id="preview"></div>
            <h2>Export</h2>
            <div class="builder-actions" style="margin-bottom:10px;">
              <button id="download" class="btn" type="button">JSON herunterladen</button>
            </div>
            <textarea id="json" class="select json-box" readonly></textarea>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { escapeHtml, slugify } from "../../lib.js";

    const STANDARD = [15, 14, 13, 12, 10, 8];
    const ABILITIES = [["str","STR","Stärke"],["dex","DEX","Geschick"],["con","CON","Konstitution"],["int","INT","Intelligenz"],["wis","WIS","Weisheit"],["cha","CHA","Charisma"]];
    const CR_XP = {"0":10,"1/8":25,"1/4":50,"1/2":100,"1":200,"2":450,"3":700,"4":1100,"5":1800,"6":2300,"7":2900,"8":3900,"9":5000,"10":5900,"11":7200,"12":8400,"13":10000,"14":11500,"15":13000,"16":15000,"17":18000,"18":20000,"19":22000,"20":25000,"21":33000,"22":41000,"23":50000,"24":62000,"25":75000,"26":90000,"27":105000,"28":120000,"29":135000,"30":155000};
    const state = {
      abilityBase: { str:15, dex:14, con:13, int:12, wis:10, cha:8 },
      abilityAdjust: { str:0, dex:0, con:0, int:0, wis:0, cha:0 },
      traits: [{ name: "Besondere Eigenschaft", text: "Beschreibe hier eine passive oder besondere Regel." }],
      actions: [{ name: "Angriff", text: "Nah- oder Fernkampfangriff: +4 zum Treffen, Reichweite 1,5 m oder Reichweite 18/72 m, ein Ziel. Treffer: 5 (1d6 + 2) Schaden." }]
    };
    const $ = id => document.getElementById(id);

    function mod(score){ return Math.floor((Number(score) - 10) / 2); }
    function signed(n){ return n >= 0 ? `+${n}` : String(n); }
    function abilityScores(){
      return Object.fromEntries(ABILITIES.map(([key]) => [
        key,
        Math.max(1, Math.min(30, Number(state.abilityBase[key] || 10) + Number(state.abilityAdjust[key] || 0)))
      ]));
    }
    function pbFromCr(cr){
      const n = cr.includes("/") ? 0 : Number(cr);
      if (!Number.isFinite(n) || n < 5) return 2;
      return Math.min(9, 3 + Math.floor((n - 5) / 4));
    }
    function splitList(value){ return String(value || "").split(",").map(x => x.trim()).filter(Boolean); }
    function cleanText(value){ return String(value ?? "").trim(); }
    function firstValue(...values){ return values.find(value => value != null && value !== ""); }
    function asArray(value){ return Array.isArray(value) ? value : (value == null || value === "" ? [] : [value]); }
    function listText(value){
      if (Array.isArray(value)) return value.map(entry => typeof entry === "object" ? cleanText(entry.name || entry.note || entry.value || entry.text) : cleanText(entry)).filter(Boolean).join(", ");
      if (value && typeof value === "object") return Object.entries(value).map(([key, entry]) => `${key.toUpperCase()} ${entry}`).join(", ");
      return cleanText(value);
    }
    function speedWalk(value){
      const speed = value?.speed ?? value?.speeds ?? value;
      if (speed && typeof speed === "object") return Number(firstValue(speed.walk, speed.walking, speed.land, 0)) || 0;
      const match = cleanText(speed).match(/[\d.,]+/);
      return match ? Number(match[0].replace(",", ".")) : 0;
    }
    function acValue(value){
      const ac = value?.armor_class ?? value?.ac;
      if (Array.isArray(ac)) return Number(firstValue(ac[0]?.value, ac[0]?.ac, ac[0])) || 10;
      if (ac && typeof ac === "object") return Number(firstValue(ac.value, ac.ac, ac.display)) || 10;
      return Number(ac) || 10;
    }
    function hpValue(value){
      const hp = value?.hit_points ?? value?.hp;
      if (hp && typeof hp === "object") return Number(firstValue(hp.average, hp.value, hp.max)) || 1;
      return Number(hp) || 1;
    }
    function hpFormula(value){
      const hp = value?.hit_points ?? value?.hp;
      return cleanText(firstValue(hp?.formula, hp?.hit_dice, value?.hit_dice, value?.hit_points_formula, ""));
    }
    function normalizeRows(value){
      return asArray(value).map(entry => {
        if (typeof entry === "string") return { name: "", text: entry };
        return { name: cleanText(entry?.name || entry?.title || ""), text: cleanText(firstValue(entry?.text, entry?.desc, entry?.description, entry?.value, entry?.type, "")) };
      }).filter(entry => entry.name || entry.text);
    }
    function readAbility(raw, key, abbr){
      const source = firstValue(raw.abilities, raw.ability_scores, raw.stats, {});
      const value = source?.[key] ?? source?.[abbr] ?? source?.[abbr.toUpperCase()] ?? raw[key] ?? raw[abbr];
      if (value && typeof value === "object") return Number(firstValue(value.score, value.value, value.base));
      return Number(value);
    }

    function renderCrOptions(){
      $("cr").innerHTML = Object.keys(CR_XP).map(cr => `<option value="${cr}" ${cr === "1/4" ? "selected" : ""}>${cr}</option>`).join("");
    }

    function resetForm(){
      $("name").value = "Neue Kreatur";
      $("kind").value = "monster";
      $("size").value = "mittel";
      $("type").value = "Humanoid";
      $("alignment").value = "neutral";
      $("cr").value = "1/4";
      $("ac").value = "12";
      $("hp").value = "11";
      $("hpFormula").value = "2d8 + 2";
      $("speed").value = "9";
      ["saves","skills","senses","languages","notes","abilitySource"].forEach(id => $(id).value = "");
      state.abilityBase = { str:15, dex:14, con:13, int:12, wis:10, cha:8 };
      state.abilityAdjust = { str:0, dex:0, con:0, int:0, wis:0, cha:0 };
      state.traits = [{ name: "Besondere Eigenschaft", text: "Beschreibe hier eine passive oder besondere Regel." }];
      state.actions = [{ name: "Angriff", text: "Nah- oder Fernkampfangriff: +4 zum Treffen, Reichweite 1,5 m oder Reichweite 18/72 m, ein Ziel. Treffer: 5 (1d6 + 2) Schaden." }];
      render();
    }

    function applyAbilities(raw){
      const generated = raw.ability_generation || {};
      const base = generated.base || {};
      const adjust = generated.adjustments || {};
      for (const [key, abbr] of ABILITIES.map(([k, a]) => [k, a])) {
        const score = readAbility(raw, key, abbr);
        const baseValue = Number(firstValue(base[key], score));
        state.abilityBase[key] = Number.isFinite(baseValue) ? Math.max(1, Math.min(30, baseValue)) : 10;
        const adjustValue = Number(firstValue(adjust[key], score - state.abilityBase[key]));
        state.abilityAdjust[key] = Number.isFinite(adjustValue) ? adjustValue : 0;
      }
      $("abilitySource").value = cleanText(generated.source || "");
    }

    function applyCreature(raw, sourceLabel = "Import"){
      if (!raw || typeof raw !== "object") throw new Error("JSON muss ein Objekt enthalten.");
      $("name").value = cleanText(firstValue(raw.name, "Neue Kreatur"));
      $("kind").value = raw.npc || raw.kind === "npc" || raw.type === "npc" ? "npc" : "monster";
      $("size").value = cleanText(firstValue(raw.size, "mittel")).toLowerCase();
      if (![...$("size").options].some(option => option.value === $("size").value)) $("size").value = "mittel";
      const type = raw.creature_type || raw.type?.type || raw.type || raw.subtype || "Humanoid";
      $("type").value = cleanText(type);
      $("alignment").value = cleanText(firstValue(raw.alignment, "neutral"));
      const cr = String(firstValue(raw.challenge_rating, raw.challenge?.cr, raw.challenge, raw.cr, "1/4"));
      $("cr").value = CR_XP[cr] != null ? cr : "1/4";
      $("ac").value = acValue(raw);
      $("hp").value = hpValue(raw);
      $("hpFormula").value = hpFormula(raw);
      $("speed").value = speedWalk(raw) || 9;
      $("saves").value = listText(firstValue(raw.saving_throws, raw.saves, raw["saving-throws"], ""));
      $("skills").value = listText(firstValue(raw.skills, ""));
      $("senses").value = listText(firstValue(raw.senses, ""));
      $("languages").value = listText(firstValue(raw.languages, ""));
      $("notes").value = cleanText(firstValue(raw.notes, raw.description, raw.background, ""));
      applyAbilities(raw);
      state.traits = normalizeRows(firstValue(raw.traits, raw.special_abilities, raw.features, []));
      state.actions = normalizeRows(firstValue(raw.actions, raw.action, []));
      if (!state.traits.length) state.traits = [];
      if (!state.actions.length) state.actions = [];
      $("importStatus").textContent = `${sourceLabel} geladen. Export ist aktualisiert.`;
      render();
    }

    async function importFromText(text, sourceLabel = "Import"){
      applyCreature(JSON.parse(text), sourceLabel);
    }

    async function loadCreatureFromUrl(){
      const params = new URLSearchParams(location.search);
      const monsterId = params.get("monster");
      const npcId = params.get("npc");
      if (!monsterId && !npcId) return;
      const wanted = npcId || monsterId;
      const direct = npcId
        ? [`../../data/monsters/npc/${encodeURIComponent(npcId)}.json`]
        : [`../../data/monsters/${encodeURIComponent(monsterId)}.json`, `../../data/monsters/important/${encodeURIComponent(monsterId)}.json`];
      let raw = null;
      for (const url of direct) {
        raw = await fetch(url, { cache: "no-cache" }).then(res => res.ok ? res.json() : null).catch(() => null);
        if (raw) break;
      }
      if (!raw) {
        const indexUrl = npcId ? "../../data/monsters/npc/index.json" : "../../data/monsters/index.json";
        const base = npcId ? "../../data/monsters/npc" : "../../data/monsters";
        const index = await fetch(indexUrl, { cache: "no-cache" }).then(res => res.ok ? res.json() : { files: [] }).catch(() => ({ files: [] }));
        const files = Array.isArray(index) ? index : (index.files || []);
        const match = files.find(file => slugify(file.replace(/\.json$/i, "").split("/").pop()) === slugify(wanted));
        if (match) raw = await fetch(`${base}/${match}`, { cache: "no-cache" }).then(res => res.ok ? res.json() : null);
      }
      if (!raw) throw new Error(`Kreatur nicht gefunden: ${wanted}`);
      applyCreature(raw, npcId ? `NSC ${npcId}` : `Monster ${monsterId}`);
    }

    function renderAbilities(){
      const scores = abilityScores();
      $("abilities").innerHTML = ABILITIES.map(([key, abbr, label]) => `
        <div class="ability-card">
          <label>${escapeHtml(label)} Basis
            <select class="select" data-ability-base="${key}">
              ${STANDARD.map(score => `<option value="${score}" ${state.abilityBase[key] === score ? "selected" : ""}>${score}</option>`).join("")}
            </select>
          </label>
          <label>Anpassung
            <input class="select" type="number" min="-10" max="20" value="${escapeHtml(state.abilityAdjust[key])}" data-ability-adjust="${key}" />
          </label>
          <label>Endwert
            <input class="select" type="number" min="1" max="30" value="${escapeHtml(scores[key])}" data-ability-final="${key}" />
          </label>
          <div><b>${escapeHtml(abbr)}</b> ${escapeHtml(scores[key])} (${escapeHtml(signed(mod(scores[key])))})</div>
        </div>
      `).join("");
      for (const select of document.querySelectorAll("[data-ability-base]")){
        select.addEventListener("change", () => {
          state.abilityBase[select.dataset.abilityBase] = Number(select.value);
          render();
        });
      }
      for (const input of document.querySelectorAll("[data-ability-adjust]")){
        input.addEventListener("input", () => {
          state.abilityAdjust[input.dataset.abilityAdjust] = Number(input.value || 0);
          render();
        });
      }
      for (const input of document.querySelectorAll("[data-ability-final]")){
        input.addEventListener("input", () => {
          const key = input.dataset.abilityFinal;
          state.abilityAdjust[key] = Number(input.value || state.abilityBase[key]) - Number(state.abilityBase[key] || 0);
          render();
        });
      }
    }

    function renderRows(kind){
      $(kind).innerHTML = state[kind].map((entry, index) => `
        <div class="row-item">
          <input class="select" value="${escapeHtml(entry.name)}" data-row-name="${kind}:${index}" placeholder="Name"/>
          <textarea class="select" rows="3" data-row-text="${kind}:${index}" placeholder="Beschreibung">${escapeHtml(entry.text)}</textarea>
          <button class="btn" type="button" data-row-remove="${kind}:${index}">Entfernen</button>
        </div>
      `).join("");
      for (const input of document.querySelectorAll(`[data-row-name^="${kind}:"]`)){
        input.addEventListener("input", () => {
          const [, index] = input.dataset.rowName.split(":");
          state[kind][Number(index)].name = input.value;
          renderOutput();
        });
      }
      for (const textarea of document.querySelectorAll(`[data-row-text^="${kind}:"]`)){
        textarea.addEventListener("input", () => {
          const [, index] = textarea.dataset.rowText.split(":");
          state[kind][Number(index)].text = textarea.value;
          renderOutput();
        });
      }
      for (const btn of document.querySelectorAll(`[data-row-remove^="${kind}:"]`)){
        btn.addEventListener("click", () => {
          const [, index] = btn.dataset.rowRemove.split(":");
          state[kind].splice(Number(index), 1);
          render();
        });
      }
    }

    function buildCreature(){
      const cr = $("cr").value;
      const name = $("name").value.trim() || "Neue Kreatur";
      const isNpc = $("kind").value === "npc";
      const abilities = abilityScores();
      return {
        id: slugify(name),
        kind: "monster",
        npc: isNpc,
        name,
        size: $("size").value,
        creature_type: $("type").value.trim(),
        alignment: $("alignment").value.trim(),
        armor_class: { value: Number($("ac").value || 10), display: String($("ac").value || 10) },
        hit_points: { average: Number($("hp").value || 1), formula: $("hpFormula").value.trim() },
        speed: { walk: Number($("speed").value || 0) },
        abilities,
        ability_generation: {
          method: "standard_array_plus_adjustments",
          standard_array: STANDARD,
          base: { ...state.abilityBase },
          adjustments: { ...state.abilityAdjust },
          source: $("abilitySource").value.trim()
        },
        saving_throws: $("saves").value.trim(),
        skills: $("skills").value.trim(),
        senses: splitList($("senses").value),
        languages: splitList($("languages").value),
        challenge_rating: cr,
        challenge: { cr, xp: CR_XP[cr] || 0, proficiency_bonus: pbFromCr(cr) },
        xp: CR_XP[cr] || 0,
        traits: state.traits.filter(x => x.name || x.text).map(x => ({ name: x.name.trim(), text: x.text.trim() })),
        actions: state.actions.filter(x => x.name || x.text).map(x => ({ name: x.name.trim(), text: x.text.trim() })),
        notes: $("notes").value.trim()
      };
    }

    function renderPreview(creature){
      const abilityLine = ABILITIES.map(([key, abbr]) => `<span class="pill"><b>${escapeHtml(abbr)}</b> ${escapeHtml(creature.abilities[key])} (${escapeHtml(signed(mod(creature.abilities[key])))})</span>`).join("");
      $("preview").innerHTML = `
        <article class="statblock">
          <div class="stat-title">${escapeHtml(creature.name)}</div>
          <div class="stat-sub">${escapeHtml(creature.size)} ${escapeHtml(creature.creature_type)}, ${escapeHtml(creature.alignment)}${creature.npc ? " - NSC" : ""}</div>
          <div><b>RK</b> ${escapeHtml(creature.armor_class.value)} | <b>TP</b> ${escapeHtml(creature.hit_points.average)} (${escapeHtml(creature.hit_points.formula)}) | <b>Bewegung</b> ${escapeHtml(creature.speed.walk)} m</div>
          <div class="pillbar" style="margin-top:8px;">${abilityLine}</div>
          <div class="stat-line"><b>Rettungswürfe</b> ${escapeHtml(creature.saving_throws || "-")}</div>
          <div><b>Fertigkeiten</b> ${escapeHtml(creature.skills || "-")}</div>
          <div><b>Sinne</b> ${escapeHtml(creature.senses.join(", ") || "-")}</div>
          <div><b>Sprachen</b> ${escapeHtml(creature.languages.join(", ") || "-")}</div>
          <div><b>HG</b> ${escapeHtml(creature.challenge.cr)} (${escapeHtml(creature.xp)} EP), <b>UEB</b> ${escapeHtml(signed(creature.challenge.proficiency_bonus))}</div>
          ${creature.traits.length ? `<div class="stat-line">${creature.traits.map(t => `<p><b>${escapeHtml(t.name)}.</b> ${escapeHtml(t.text)}</p>`).join("")}</div>` : ""}
          ${creature.actions.length ? `<div class="stat-line"><h3>Aktionen</h3>${creature.actions.map(a => `<p><b>${escapeHtml(a.name)}.</b> ${escapeHtml(a.text)}</p>`).join("")}</div>` : ""}
        </article>
      `;
    }

    function renderOutput(){
      const creature = buildCreature();
      renderPreview(creature);
      $("json").value = JSON.stringify(creature, null, 2);
    }

    function render(){
      renderAbilities();
      renderRows("traits");
      renderRows("actions");
      renderOutput();
    }

    function downloadJson(){
      const creature = buildCreature();
      const folder = creature.npc ? "npc" : "monster";
      const blob = new Blob([JSON.stringify(creature, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${folder}-${creature.id || "kreatur"}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    renderCrOptions();
    ["name","kind","size","type","alignment","cr","ac","hp","hpFormula","speed","saves","skills","senses","languages","notes","abilitySource"].forEach(id => $(id).addEventListener("input", renderOutput));
    $("addTrait").addEventListener("click", () => { state.traits.push({ name: "", text: "" }); render(); });
    $("addAction").addEventListener("click", () => { state.actions.push({ name: "", text: "" }); render(); });
    $("download").addEventListener("click", downloadJson);
    $("resetForm").addEventListener("click", resetForm);
    $("importJson").addEventListener("click", async () => {
      try {
        await importFromText($("importText").value, "Textarea-JSON");
      } catch (err) {
        $("importStatus").textContent = `Import fehlgeschlagen: ${err.message || err}`;
      }
    });
    $("importFile").addEventListener("change", async event => {
      const file = event.currentTarget.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        $("importText").value = text;
        await importFromText(text, file.name);
      } catch (err) {
        $("importStatus").textContent = `Import fehlgeschlagen: ${err.message || err}`;
      }
    });
    render();
    await loadCreatureFromUrl().catch(err => { $("importStatus").textContent = err.message || String(err); });
  </script>
</body>
</html>
