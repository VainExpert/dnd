<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Generatoren</title>
  <link rel="stylesheet" href="../../styles.css?v=theme-20260422"/>
  <script src="../../theme.js?v=theme-20260422"></script>

  <style>
    .tool-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--rule);
      background:#0b0e16;
      color:var(--text);
      cursor:pointer;
    }
    .btn:hover{ border-color: rgba(225,91,79,.35); background: rgba(225,91,79,.12); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .encounter-builder{
      display:grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap:12px;
      align-items:start;
    }
    .encounter-controls{
      display:grid;
      gap:10px;
    }
    .encounter-controls label,
    .loot-controls label{
      display:grid;
      gap:5px;
      font-size:13px;
      color:var(--muted);
    }
    .encounter-party{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .pc-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 9px;
      border:1px solid var(--rule);
      border-radius:8px;
      background:rgba(255,255,255,.03);
    }
    .pc-chip button{
      width:22px;
      height:22px;
      padding:0;
      border-radius:999px;
      line-height:1;
    }
    .budget-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:8px;
      margin-top:8px;
    }
    .budget-tile{
      padding:9px;
      border:1px solid var(--rule);
      border-radius:8px;
      background:rgba(255,255,255,.03);
    }
    .budget-tile.active{ border-color:rgba(225,91,79,.55); background:rgba(225,91,79,.12); }
    .encounter-list,
    .loot-items{
      display:grid;
      gap:8px;
      margin-top:10px;
    }
    .encounter-row,
    .loot-item{
      padding:8px;
      border:1px solid var(--rule);
      border-radius:8px;
      background:rgba(255,255,255,.025);
    }
    .encounter-row{
      display:grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap:8px;
      align-items:center;
    }
    .encounter-row input{ width:72px; }
    .loot-controls{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap:10px;
      align-items:end;
    }
    .loot-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px;
    }
    .loot-grid{
      display:grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr);
      gap:12px;
      margin-top:12px;
      align-items:start;
    }
    .checkbox-row{
      display:flex;
      gap:8px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
    }
    @media (max-width: 820px){
      .encounter-builder{ grid-template-columns:1fr; }
      .budget-grid{ grid-template-columns:1fr; }
      .encounter-row{ grid-template-columns:1fr auto; }
      .loot-grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">Generatoren</div>
      <div class="subtitle">Zufallstabellen • Begegnungen • Loot</div>
    </div>
    <div class="top-actions">
      <a class="home-btn" href="../../index.html">← Startseite</a>
    </div>
  </header>

  <main class="main">
    <div class="content" style="max-width:1100px;">
      <h1>Zufallstabellen</h1>
      <div class="tool-row">
        <select id="table" class="select"></select>
        <button id="roll" class="btn">Wuerfeln</button>
      </div>
      <div id="result" style="margin-top:12px;"></div>

      <h2 style="margin-top:26px;">Begegnungsbauer (D&amp;D 2024)</h2>
      <div class="encounter-builder">
        <div class="mini-box">
          <div class="mini-box-title">Gruppe</div>
          <div class="mini-box-text">
            <div class="tool-row">
              <select id="pcSelect" class="select"></select>
              <button id="addPc" class="btn">SC hinzufuegen</button>
              <button id="addAllPcs" class="btn">Alle SCs</button>
              <button id="clearPcs" class="btn">Leeren</button>
            </div>
            <div id="partyList" class="encounter-party"></div>

            <div class="tool-row" style="margin-top:12px;">
              <label>
                Manuelle Anzahl
                <input id="manualCount" class="select" type="number" min="1" max="12" value="4" style="width:120px;" />
              </label>
              <label>
                Manuelle Stufe
                <input id="manualLevel" class="select" type="number" min="1" max="20" value="3" style="width:120px;" />
              </label>
            </div>

            <div id="budgetSummary"></div>
          </div>
        </div>

        <div class="mini-box">
          <div class="mini-box-title">Encounter</div>
          <div class="mini-box-text encounter-controls">
            <label>
              Ziel-Schwierigkeit
              <select id="difficulty" class="select">
                <option value="moderate">Moderate</option>
                <option value="low">Low</option>
                <option value="high">High</option>
              </select>
            </label>
            <label>
              HG-Filter
              <select id="cr" class="select">
                <option value="">Beliebiger HG</option>
                <option>0</option><option>1/8</option><option>1/4</option><option>1/2</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
                <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
                <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
                <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
              </select>
            </label>
            <label>
              Namensfilter
              <input id="monsterSearch" class="select" type="search" placeholder="Monster suchen..." />
            </label>
            <div class="tool-row">
              <button id="gen" class="btn">Budget fuellen</button>
              <button id="addMonster" class="btn">Monster hinzufuegen</button>
              <button id="clearEncounter" class="btn">Encounter leeren</button>
            </div>
          </div>
        </div>
      </div>
      <div id="enc" style="margin-top:12px;"></div>

      <h2 style="margin-top:26px;">Lootgenerator (D&amp;D 2024)</h2>
      <div class="mini-box">
        <div class="mini-box-title">Beute nach HG</div>
        <div class="mini-box-text">
          <div class="loot-controls">
            <label>
              Beuteart
              <select id="lootMode" class="select">
                <option value="hoard">Schatzhort / Questbelohnung</option>
                <option value="individual">Einzelbeute</option>
              </select>
            </label>
            <label>
              HG / Anfuehrer-HG
              <select id="lootCr" class="select">
                <option>0</option><option>1/8</option><option>1/4</option><option>1/2</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
                <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
                <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
                <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
              </select>
            </label>
            <label>
              Schwierigkeit
              <select id="lootDifficulty" class="select">
                <option value="low">Low</option>
                <option value="moderate" selected>Moderate</option>
                <option value="high">High</option>
              </select>
            </label>
            <label>
              Kreaturenzahl
              <input id="lootCreatureCount" class="select" type="number" min="1" max="99" value="1" />
            </label>
          </div>

          <div class="loot-actions">
            <label class="checkbox-row">
              <input id="lootMagicToggle" type="checkbox" checked />
              High-Begegnungen mit gewoehnlichen/ungewoehnlichen magischen Items anreichern
            </label>
            <button id="lootUseEncounter" class="btn">Encounter uebernehmen</button>
            <button id="lootGenerate" class="btn">Loot generieren</button>
          </div>

          <div id="lootResult" style="margin-top:12px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../data/tables/tables-global.js?v=3"></script>

  <script type="module">
    import { loadIndex, loadMany, escapeHtml, normalizeItem, normalizeTable, rollTableEntry, renderTableHtml } from "../../lib.js";
    import { TABLE_FILES, TABLE_DATA_BY_FILE } from "../../data/tables/tables-data.js?v=3";

    const tableSel = document.getElementById("table");
    const rollBtn = document.getElementById("roll");
    const resultEl = document.getElementById("result");

    const tables = TABLE_FILES
      .map(file => normalizeTable(TABLE_DATA_BY_FILE[file], file.replace(/\.json$/i, "")))
      .filter(Boolean);

    tableSel.innerHTML = "";
    for (const t of tables){
      const opt = document.createElement("option");
      opt.value = t.id || t.name;
      opt.textContent = t.name;
      tableSel.appendChild(opt);
    }

    function pick(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function roll(){
      const name = tableSel.value;
      const t = tables.find(x => (x.id || x.name) === name);
      if (!t){
        resultEl.innerHTML = "<p>Keine Eintraege.</p>";
        return;
      }
      const r = rollTableEntry(t);
      resultEl.innerHTML = `
        <div class="mini-box">
          <div class="mini-box-title">${escapeHtml(t.name)}${t.dice ? " (" + escapeHtml(t.dice) + ")" : ""}${r.roll != null ? " • Wurf " + escapeHtml(String(r.roll)) : ""}</div>
          <div class="mini-box-text">
            ${renderTableHtml(t, r)}
          </div>
        </div>
      `;
    }
    rollBtn.addEventListener("click", roll);
    roll();

    const XP_BUDGET_2024 = {
      1: { low: 50, moderate: 75, high: 100 },
      2: { low: 100, moderate: 150, high: 200 },
      3: { low: 150, moderate: 225, high: 400 },
      4: { low: 250, moderate: 375, high: 500 },
      5: { low: 500, moderate: 750, high: 1100 },
      6: { low: 600, moderate: 1000, high: 1400 },
      7: { low: 750, moderate: 1300, high: 1700 },
      8: { low: 1000, moderate: 1700, high: 2100 },
      9: { low: 1300, moderate: 2000, high: 2600 },
      10: { low: 1600, moderate: 2300, high: 3100 },
      11: { low: 1900, moderate: 2900, high: 4100 },
      12: { low: 2200, moderate: 3700, high: 4700 },
      13: { low: 2600, moderate: 4200, high: 5400 },
      14: { low: 2900, moderate: 4900, high: 6200 },
      15: { low: 3300, moderate: 5400, high: 7800 },
      16: { low: 3800, moderate: 6100, high: 9800 },
      17: { low: 4500, moderate: 7200, high: 11700 },
      18: { low: 5000, moderate: 8700, high: 14200 },
      19: { low: 5500, moderate: 10700, high: 17200 },
      20: { low: 6400, moderate: 13200, high: 22000 }
    };

    const CR_XP = {
      "0": 10, "1/8": 25, "1/4": 50, "1/2": 100,
      "1": 200, "2": 450, "3": 700, "4": 1100, "5": 1800,
      "6": 2300, "7": 2900, "8": 3900, "9": 5000, "10": 5900,
      "11": 7200, "12": 8400, "13": 10000, "14": 11500, "15": 13000,
      "16": 15000, "17": 18000, "18": 20000, "19": 22000, "20": 25000,
      "21": 33000, "22": 41000, "23": 50000, "24": 62000, "25": 75000,
      "26": 90000, "27": 105000, "28": 120000, "29": 135000, "30": 155000
    };

    const DIFFICULTY_LABELS = { low: "Low", moderate: "Moderate", high: "High" };
    const LOOT_TABLE_2024 = {
      0: { label: "HG 0-4", individualGp: 10, hoardGp: 500, highItems: 1 },
      5: { label: "HG 5-10", individualGp: 90, hoardGp: 4400, highItems: 2 },
      11: { label: "HG 11-16", individualGp: 1100, hoardGp: 36000, highItems: 3 },
      17: { label: "HG 17+", individualGp: 9000, hoardGp: 330000, highItems: 4 }
    };

    const pcSelect = document.getElementById("pcSelect");
    const addPcBtn = document.getElementById("addPc");
    const addAllPcsBtn = document.getElementById("addAllPcs");
    const clearPcsBtn = document.getElementById("clearPcs");
    const partyListEl = document.getElementById("partyList");
    const budgetSummaryEl = document.getElementById("budgetSummary");
    const manualCountEl = document.getElementById("manualCount");
    const manualLevelEl = document.getElementById("manualLevel");
    const difficultyEl = document.getElementById("difficulty");
    const crSel = document.getElementById("cr");
    const monsterSearchEl = document.getElementById("monsterSearch");
    const genBtn = document.getElementById("gen");
    const addMonsterBtn = document.getElementById("addMonster");
    const clearEncounterBtn = document.getElementById("clearEncounter");
    const encEl = document.getElementById("enc");
    const lootModeEl = document.getElementById("lootMode");
    const lootCrEl = document.getElementById("lootCr");
    const lootDifficultyEl = document.getElementById("lootDifficulty");
    const lootCreatureCountEl = document.getElementById("lootCreatureCount");
    const lootMagicToggleEl = document.getElementById("lootMagicToggle");
    const lootUseEncounterBtn = document.getElementById("lootUseEncounter");
    const lootGenerateBtn = document.getElementById("lootGenerate");
    const lootResultEl = document.getElementById("lootResult");

    let pcs = [];
    let monsters = [];
    let items = [];
    let itemLoadPromise = null;
    let selectedPcIds = [];
    let encounter = [];

    try{
      const pcFiles = await loadIndex("../../data/pcs/index.json");
      pcs = (await loadMany("../../data/pcs", pcFiles)).map(p => ({
        ...p,
        id: p.id || p.slug || p.name || "",
        name: p.name || p.character?.identity?.name || p.id || "SC",
        level: Number(p.level ?? p.character?.identity?.class?.level ?? 1),
        class: p.class || p.character?.identity?.class?.name || "",
        player: p.player || p.character?.identity?.player_name || ""
      })).filter(p => p.id && Number.isFinite(p.level));
    } catch {}

    try{
      const mFiles = await loadIndex("../../data/monsters/index.json");
      monsters = (await loadMany("../../data/monsters", mFiles)).map(m => ({
        ...m,
        id: m.id || m.slug || m.name || "",
        name: m.name || m.id || "Monster"
      })).filter(m => m.id && getMonsterXp(m) > 0);
    } catch {}

    if (!monsters.length){
      encEl.innerHTML = "<p>Begegnungen konnten nicht geladen werden.</p>";
      genBtn.disabled = true;
      addMonsterBtn.disabled = true;
    }

    function getMonsterId(m){
      return m.id || m.slug || m.name || "";
    }

    function getCR(m){
      const v = (m.challenge && typeof m.challenge === "object") ? (m.challenge.cr ?? "") : (m.challenge ?? "");
      return String(v ?? "").trim();
    }

    function getMonsterXp(m){
      const direct = Number(String(m.xp ?? m.challenge?.xp ?? "").replace(/[^\d.-]/g, ""));
      if (Number.isFinite(direct) && direct > 0) return direct;
      return CR_XP[getCR(m)] ?? 0;
    }

    function parseCrValue(cr){
      const value = String(cr ?? "").trim();
      if (!value) return 0;
      if (value.includes("/")){
        const [a, b] = value.split("/").map(Number);
        return Number.isFinite(a) && Number.isFinite(b) && b ? a / b : 0;
      }
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function getLootBand(cr){
      const value = parseCrValue(cr);
      if (value >= 17) return LOOT_TABLE_2024[17];
      if (value >= 11) return LOOT_TABLE_2024[11];
      if (value >= 5) return LOOT_TABLE_2024[5];
      return LOOT_TABLE_2024[0];
    }

    function normalizeRarity(value){
      return String(value ?? "")
        .toLowerCase()
        .replace(/ä/g, "ae")
        .replace(/ö/g, "oe")
        .replace(/ü/g, "ue")
        .replace(/ß/g, "ss")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function isMagicItem(item){
      const rarity = normalizeRarity(item?.rarity);
      const tags = Array.isArray(item?.tags) ? item.tags.map(tag => normalizeRarity(tag)) : [];
      return !!rarity || tags.includes("magisch");
    }

    function magicItemsByRarity(rarity){
      const wanted = normalizeRarity(rarity);
      return items.filter(item => isMagicItem(item) && normalizeRarity(item.rarity) === wanted);
    }

    async function ensureItemsLoaded(){
      if (items.length) return items;
      if (!itemLoadPromise){
        itemLoadPromise = (async () => {
          try{
            const itemFiles = await loadIndex("../../data/items/index.json");
            items = (await loadMany("../../data/items", itemFiles))
              .map(normalizeItem)
              .filter(Boolean);
          } catch {
            items = [];
          }
          return items;
        })();
      }
      return itemLoadPromise;
    }

    function fmtNumber(value){
      return new Intl.NumberFormat("de-DE").format(Math.round(Number(value) || 0));
    }

    function clampLevel(value){
      const n = Math.round(Number(value));
      if (!Number.isFinite(n)) return 1;
      return Math.min(20, Math.max(1, n));
    }

    function getSelectedPcs(){
      const ids = new Set(selectedPcIds);
      return pcs.filter(p => ids.has(p.id));
    }

    function getPartyEntries(){
      const selected = getSelectedPcs();
      if (selected.length) return selected.map(p => ({ ...p, source: "pc" }));
      const count = Math.max(1, Math.min(12, Number(manualCountEl.value || 4)));
      const level = clampLevel(manualLevelEl.value || 1);
      return Array.from({ length: count }, (_, index) => ({
        id: `manual-${index}`,
        name: `SC ${index + 1}`,
        level,
        source: "manual"
      }));
    }

    function getPartyBudget(){
      return getPartyEntries().reduce((sum, p) => {
        const row = XP_BUDGET_2024[clampLevel(p.level)] || XP_BUDGET_2024[1];
        return {
          low: sum.low + row.low,
          moderate: sum.moderate + row.moderate,
          high: sum.high + row.high
        };
      }, { low: 0, moderate: 0, high: 0 });
    }

    function classifyEncounter(totalXp, budget){
      if (totalXp <= 0) return "Noch leer";
      if (totalXp <= budget.low) return "Low";
      if (totalXp <= budget.moderate) return "Moderate";
      if (totalXp <= budget.high) return "High";
      return "Ueber High";
    }

    function encounterStats(){
      const budget = getPartyBudget();
      const totalXp = encounter.reduce((sum, entry) => sum + getMonsterXp(entry.monster) * entry.count, 0);
      const totalCount = encounter.reduce((sum, entry) => sum + entry.count, 0);
      const leader = encounter.reduce((best, entry) => {
        if (!best) return entry.monster;
        return parseCrValue(getCR(entry.monster)) > parseCrValue(getCR(best)) ? entry.monster : best;
      }, null);
      return {
        budget,
        totalXp,
        totalCount,
        classification: classifyEncounter(totalXp, budget),
        leader
      };
    }

    function randomInt(min, max){
      const from = Math.min(min, max);
      const to = Math.max(min, max);
      return Math.floor(Math.random() * (to - from + 1)) + from;
    }

    function pickUniqueItems(pool, count){
      const available = [...pool];
      const picked = [];
      while (available.length && picked.length < count){
        const index = Math.floor(Math.random() * available.length);
        picked.push(available.splice(index, 1)[0]);
      }
      return picked;
    }

    function rollMagicItemCount(mode, band, creatureCount){
      if (mode === "individual"){
        return Math.max(1, Math.min(band.highItems, Math.ceil(creatureCount / 4)));
      }
      return randomInt(1, band.highItems);
    }

    function rollMagicItemsForBand(band, count){
      const commonPool = magicItemsByRarity("gewoehnlich");
      const uncommonPool = magicItemsByRarity("ungewoehnlich");
      const picked = [];
      const usedIds = new Set();

      for (let i = 0; i < count; i++){
        const roll = Math.random();
        let rarity = "ungewoehnlich";
        if (band === LOOT_TABLE_2024[0]) rarity = roll < 0.65 ? "gewoehnlich" : "ungewoehnlich";
        else if (band === LOOT_TABLE_2024[5]) rarity = roll < 0.35 ? "gewoehnlich" : "ungewoehnlich";
        else rarity = roll < 0.15 ? "gewoehnlich" : "ungewoehnlich";

        const primaryPool = (rarity === "gewoehnlich" ? commonPool : uncommonPool).filter(item => !usedIds.has(item.id));
        const fallbackPool = (rarity === "gewoehnlich" ? uncommonPool : commonPool).filter(item => !usedIds.has(item.id));
        const [item] = pickUniqueItems(primaryPool.length ? primaryPool : fallbackPool, 1);
        if (item){
          picked.push(item);
          usedIds.add(item.id);
        }
      }
      return picked;
    }

    async function renderLoot(){
      const mode = lootModeEl.value;
      const creatureCount = Math.max(1, Number(lootCreatureCountEl.value || 1));
      const difficulty = lootDifficultyEl.value;
      const band = getLootBand(lootCrEl.value);
      const gp = mode === "individual" ? band.individualGp * creatureCount : band.hoardGp;
      const addMagic = lootMagicToggleEl.checked && difficulty === "high";
      if (addMagic) await ensureItemsLoaded();
      const itemCount = addMagic ? rollMagicItemCount(mode, band, creatureCount) : 0;
      const magicItems = addMagic ? rollMagicItemsForBand(band, itemCount) : [];

      lootResultEl.innerHTML = `
        <div class="loot-grid">
          <div class="mini-box" style="margin:0;">
            <div class="mini-box-title">Beute</div>
            <div class="mini-box-text">
              <div class="pillbar">
                <span class="pill"><b>Tabelle</b> ${escapeHtml(band.label)}</span>
                <span class="pill"><b>Art</b> ${escapeHtml(mode === "individual" ? "Einzelbeute" : "Schatzhort")}</span>
                <span class="pill"><b>Schwierigkeit</b> ${escapeHtml(DIFFICULTY_LABELS[difficulty])}</span>
              </div>
              <p><b>Gold:</b> ${fmtNumber(gp)} GM</p>
              <p class="muted">${escapeHtml(mode === "individual"
                ? `Durchschnittliche 2024-Einzelbeute fuer ${creatureCount} Kreatur${creatureCount === 1 ? "" : "en"}.`
                : "Durchschnittlicher 2024-Schatzhort bzw. eine Questbelohnung fuer dieses HG-Band.")}</p>
            </div>
          </div>
          <div class="mini-box" style="margin:0;">
            <div class="mini-box-title">Magische Extras</div>
            <div class="mini-box-text">
              ${addMagic
                ? (magicItems.length
                    ? `<div class="loot-items">${magicItems.map(item => `
                        <div class="loot-item">
                          <b><a href="../items/item.html?id=${encodeURIComponent(item.id || item.name || "")}">${escapeHtml(item.name || "Magischer Gegenstand")}</a></b>
                          <div class="muted">${escapeHtml(item.rarity || "magisch")}${item.requires_attunement ? " • Bindung" : ""}</div>
                        </div>
                      `).join("")}</div>`
                    : "<p>Es konnten keine passenden magischen Gegenstaende aus der lokalen Item-Liste geladen werden.</p>")
                : "<p>Keine magischen Items: Extras werden nur fuer High-Begegnungen hinzugefuegt.</p>"}
            </div>
          </div>
        </div>
      `;
    }

    function filteredMonsters(){
      const cr = crSel.value;
      const q = (monsterSearchEl.value || "").trim().toLowerCase();
      let pool = monsters.filter(m => getMonsterXp(m) > 0);
      if (cr) pool = pool.filter(m => getCR(m) === cr);
      if (q) pool = pool.filter(m => [m.name, getMonsterId(m), m.type?.type, ...(m.type?.tags || [])].join(" ").toLowerCase().includes(q));
      return pool;
    }

    function addEncounterMonster(monster, count = 1){
      const id = getMonsterId(monster);
      const existing = encounter.find(entry => entry.id === id);
      if (existing) existing.count += count;
      else encounter.push({ id, count, monster });
      encounter = encounter.filter(entry => entry.count > 0);
      renderEncounter();
    }

    function generate(){
      const budget = getPartyBudget();
      const target = budget[difficultyEl.value] || budget.moderate;
      const pool = filteredMonsters()
        .filter(m => getMonsterXp(m) <= target)
        .sort((a, b) => getMonsterXp(b) - getMonsterXp(a));

      if (!pool.length){
        encounter = [];
        renderEncounter("<p>Keine Monster entsprechen diesem Filter oder Budget.</p>");
        return;
      }

      let remaining = target;
      const generated = [];
      let guard = 0;
      while (remaining > 0 && guard < 80){
        guard++;
        const affordable = pool.filter(m => getMonsterXp(m) <= remaining);
        if (!affordable.length) break;
        const top = affordable.slice(0, Math.min(8, affordable.length));
        const m = pick(top);
        generated.push(m);
        remaining -= getMonsterXp(m);
        if (generated.length > getPartyEntries().length * 2 && Math.random() < 0.35) break;
      }

      encounter = [];
      for (const m of generated) addEncounterMonster(m, 1);
      renderEncounter();
    }

    function renderPcOptions(){
      pcSelect.innerHTML = pcs.map(p => {
        const subtitle = [p.class, `Lv ${p.level}`, p.player].filter(Boolean).join(" • ");
        return `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}${subtitle ? ` (${escapeHtml(subtitle)})` : ""}</option>`;
      }).join("") || '<option value="">Keine SCs gefunden</option>';
    }

    function renderParty(){
      const selected = getSelectedPcs();
      partyListEl.innerHTML = selected.length
        ? selected.map(p => `
            <span class="pc-chip">
              <a href="../spieler/pc.html?id=${encodeURIComponent(p.id)}">${escapeHtml(p.name)}</a>
              <span class="muted">Lv ${escapeHtml(p.level)}</span>
              <button class="btn" type="button" data-remove-pc="${escapeHtml(p.id)}" aria-label="SC entfernen">×</button>
            </span>
          `).join("")
        : '<span class="muted">Keine SCs ausgewaehlt; der manuelle Gruppenwert wird verwendet.</span>';

      for (const btn of partyListEl.querySelectorAll("[data-remove-pc]")){
        btn.addEventListener("click", () => {
          selectedPcIds = selectedPcIds.filter(id => id !== btn.dataset.removePc);
          renderAll();
        });
      }
    }

    function renderBudget(){
      const budget = getPartyBudget();
      const party = getPartyEntries();
      const partyLine = party[0]?.source === "manual"
        ? `${party.length} SCs auf Stufe ${party[0].level}`
        : party.map(p => `${p.name} Lv ${p.level}`).join(", ");
      budgetSummaryEl.innerHTML = `
        <div class="muted" style="margin-top:10px;">${escapeHtml(partyLine)}</div>
        <div class="budget-grid">
          ${["low", "moderate", "high"].map(key => `
            <div class="budget-tile ${difficultyEl.value === key ? "active" : ""}">
              <div class="mini-box-title">${DIFFICULTY_LABELS[key]}</div>
              <div class="mono">${fmtNumber(budget[key])} EP</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderEncounter(extraHtml = ""){
      const stats = encounterStats();
      const budget = stats.budget;
      const totalXp = stats.totalXp;
      const target = budget[difficultyEl.value] || budget.moderate;
      const remaining = target - totalXp;
      const difficulty = stats.classification;

      const rows = encounter.map((entry, index) => {
        const m = entry.monster;
        const mid = getMonsterId(m);
        const crv = getCR(m) || "—";
        const xp = getMonsterXp(m);
        return `
          <div class="encounter-row">
            <div>
              <b><a href="../bestiarium/monster.html?id=${encodeURIComponent(mid)}">${escapeHtml(m.name)}</a></b>
              <div class="muted">HG ${escapeHtml(crv)} • ${fmtNumber(xp)} EP pro Kreatur</div>
            </div>
            <input class="select" type="number" min="1" max="99" value="${escapeHtml(entry.count)}" data-enc-count="${index}" />
            <button class="btn" type="button" data-enc-remove="${index}">Entfernen</button>
          </div>
        `;
      }).join("");

      encEl.innerHTML = `
        <div class="mini-box">
          <div class="mini-box-title">Begegnung • ${escapeHtml(difficulty)}</div>
          <div class="mini-box-text">
            <div class="pillbar">
              <span class="pill"><b>Gesamt</b> ${fmtNumber(totalXp)} EP</span>
              <span class="pill"><b>Ziel</b> ${escapeHtml(DIFFICULTY_LABELS[difficultyEl.value])} • ${fmtNumber(target)} EP</span>
              <span class="pill"><b>Rest</b> ${fmtNumber(remaining)} EP</span>
            </div>
            ${extraHtml}
            ${rows ? `<div class="encounter-list">${rows}</div>` : "<p>Noch keine Monster ausgewaehlt.</p>"}
          </div>
        </div>
      `;

      for (const input of encEl.querySelectorAll("[data-enc-count]")){
        input.addEventListener("input", () => {
          const entry = encounter[Number(input.dataset.encCount)];
          if (!entry) return;
          entry.count = Math.max(1, Number(input.value || 1));
          renderEncounter();
        });
      }
      for (const btn of encEl.querySelectorAll("[data-enc-remove]")){
        btn.addEventListener("click", () => {
          encounter.splice(Number(btn.dataset.encRemove), 1);
          renderEncounter();
        });
      }
    }

    function syncLootControlsFromEncounter(){
      const stats = encounterStats();
      lootCrEl.value = getCR(stats.leader) || "0";
      lootCreatureCountEl.value = String(Math.max(1, stats.totalCount || 1));
      lootDifficultyEl.value = stats.classification === "Low"
        ? "low"
        : (stats.classification === "Moderate" ? "moderate" : "high");
    }

    function updateLootCreatureInput(){
      lootCreatureCountEl.disabled = lootModeEl.value !== "individual";
    }

    function renderAll(){
      renderParty();
      renderBudget();
      renderEncounter();
      updateLootCreatureInput();
    }

    addPcBtn.addEventListener("click", () => {
      const id = pcSelect.value;
      if (id && !selectedPcIds.includes(id)) selectedPcIds.push(id);
      renderAll();
    });
    addAllPcsBtn.addEventListener("click", () => {
      selectedPcIds = pcs.map(p => p.id);
      renderAll();
    });
    clearPcsBtn.addEventListener("click", () => {
      selectedPcIds = [];
      renderAll();
    });
    manualCountEl.addEventListener("input", renderAll);
    manualLevelEl.addEventListener("input", renderAll);
    difficultyEl.addEventListener("change", renderAll);
    crSel.addEventListener("change", renderEncounter);
    monsterSearchEl.addEventListener("input", renderEncounter);
    addMonsterBtn.addEventListener("click", () => {
      const pool = filteredMonsters().sort((a, b) => getMonsterXp(a) - getMonsterXp(b));
      if (!pool.length){
        renderEncounter("<p>Keine Monster entsprechen diesem Filter.</p>");
        return;
      }
      addEncounterMonster(pool[0], 1);
    });
    clearEncounterBtn.addEventListener("click", () => {
      encounter = [];
      renderEncounter();
    });

    lootModeEl.addEventListener("change", () => {
      updateLootCreatureInput();
      renderLoot();
    });
    lootCrEl.addEventListener("change", renderLoot);
    lootDifficultyEl.addEventListener("change", renderLoot);
    lootCreatureCountEl.addEventListener("input", renderLoot);
    lootMagicToggleEl.addEventListener("change", renderLoot);
    lootUseEncounterBtn.addEventListener("click", () => {
      syncLootControlsFromEncounter();
      renderLoot();
    });
    lootGenerateBtn.addEventListener("click", renderLoot);

    renderPcOptions();
    renderAll();
    genBtn.addEventListener("click", generate);
    syncLootControlsFromEncounter();
    renderLoot();
  </script>

  <script>
    (function(){
      const api = window.DND_TABLES;
      const tableSel = document.getElementById("table");
      const rollBtn = document.getElementById("roll");
      const resultEl = document.getElementById("result");
      if (!api || !tableSel || !rollBtn || !resultEl) return;
      tableSel.innerHTML = "";

      const tables = (api.files || [])
        .map(file => api.normalizeTable(api.dataByFile[file], file.replace(/\.json$/i, "")))
        .filter(Boolean);

      for (const table of tables){
        const opt = document.createElement("option");
        opt.value = table.id || table.name;
        opt.textContent = table.name;
        tableSel.appendChild(opt);
      }

      function render(){
        const selected = tableSel.value;
        const table = tables.find(entry => (entry.id || entry.name) === selected);
        if (!table){
          resultEl.innerHTML = "<p>Keine Eintraege.</p>";
          return;
        }
        const rolled = api.rollTableEntry(table);
        resultEl.innerHTML = `
          <div class="mini-box">
            <div class="mini-box-title">${api.escapeHtml(table.name)}${table.dice ? ` (${api.escapeHtml(table.dice)})` : ""}${rolled.roll != null ? ` • Wurf ${api.escapeHtml(String(rolled.roll))}` : ""}</div>
            <div class="mini-box-text">
              ${api.renderTableHtml(table, rolled)}
            </div>
          </div>
        `;
      }

      rollBtn.addEventListener("click", render);
      render();
    })();
  </script>
</body>
</html>
